# Great Vespers section map for the parish choir PDF ("Great Vespers with Lity & Artoklasia", 2026-11-20 edition, eve of the Entrance).
# Structure and rules only -- never PDF text. Extracted locally into yocal_service/local/vespers_template.json (git-ignored):
#   python -m yocal_service.build_template PDF --service vespers
# Keys as in liturgy_sections.yaml, plus:
#   roles:      the booklet's speaker abbreviations ('P: ...') -> role
#   when_slot:  the section is shown only when the Rules resolve that slot for the date (feast-only parts: readings, Lity)
#
# The booklet is the Nov 21 festal edition: every Nov-21 text (stichera, readings, Lity idiomela, aposticha, apolytikion) is a
# variable slot (`replace:` / `spans:`), never fixed text. Fixed: everything invariable (opening, Psalm 103, litanies, kekragaria
# verses, entrance, Gladsome Light, evening prayer, Nunc Dimittis, Trisagion prayers, Lity litany/prayers, Artoklasia, dismissal).
# Score-only pages (Anoixantaria, Lord I have cried verses) give no text: notation is filtered out.
# seasonal: none; the booklet has no bracketed rubric opening a paragraph (the bracketed name petitions are inline, kept as text).
begin: '^\s*Great Vespers\s*$'

roles: {P: Priest, D: Deacon, C: Choir, R: Reader}

seasonal: []

sections:
  - {id: opening, start: '^Great Vespers$', title: Opening of Vespers}
  - {id: psalm_103, start: '^Psalm 103$', title: Psalm 103}
  - {id: anoixantaria, start: '^Anoixantaria\b', title: Anoixantaria, raw_anchor: true}
  - {id: litany_peace, start: '^Litany of Peace$', title: Litany of Peace}
  - {id: psalter, start: '^Psalter Reading$', title: Psalter Reading, replace: vespers.kathisma}
  # Typikon (Khoury/Morris) 1st Kathisma + weekday Vespers order, Violakis Typikon Order for Sunday, and the booklet all place the Little Litany
  # "following the Psalms": it closes the Psalter reading, so it is shown only when the Rules appoint vespers.kathisma (#84; until it lands: never).
  - {id: little_litany, start: '^The Little Litany$', title: Little Litany, when_slot: vespers.kathisma}
  - id: lord_i_have_cried
    start: '^Lord, I have cried$'
    title: Lord, I have cried
    # the kekragaria verses printed as text stay fixed; the score pages after them (verses + stichera) -> the Rules' stichera
    spans: [{start: '^Lord, I have cried\.$', until: '(?!)', slot: vespers.lihc.stichera}]
    music: [{key: lihc, title: 'Lord, I have cried', dcs: '^lihc'}, {key: stichera, title: 'Stichera', dcs: '^(stichera\d|sticglory)'}]
  - {id: entrance, start: '^When the choir has completed the chanting of Lord, I have cried', title: The Entrance, keep_first: true}
  - id: gladsome_light
    start: '^The Hymn of Thanksgiving at the Lighting of the Lamps$'
    title: Gladsome Light
    music: [{key: phos_hilaron, title: 'Gladsome Light', dcs: '^fosilaron\.', anca: 'GLADSOME LIGHT'}]
  - id: prokeimenon
    start: '^At the end of the hymn of thanksgiving'
    title: The Evening Prokeimenon
    keep_first: true
    spans: [{start: '^The Evening Prokeimenon \(', until: '(?!)', slot: vespers.prokeimenon}]
    music: [{key: prokeimenon, title: Prokeimenon, dcs: 'prokeimenon\.'}]
  - id: readings
    start: '^The Readings$'
    title: The Readings
    when_slot: vespers.readings
    spans: [{start: '^Priest: Wisdom!$', until: '^Following the readings', slot: vespers.readings}]
  - {id: litany_fervent, start: '^Litany of Fervent Supplication$', title: Litany of Fervent Supplication}
  - {id: evening_prayer, start: '^The Evening Prayer$', title: Vouchsafe, O Lord}
  - {id: litany_supplication, start: '^The Litany of Supplication$', title: Litany of Supplication}
  # starts at the rubric before "Peace to all / Bow your heads to the Lord" (the dialogue belongs to the bowing, not to the litany)
  - {id: bowing_heads, start: '^The deacon moves to stand before the ikon of Christ', title: Bowing of the Heads, keep_first: true}
  - {id: litia, start: '^Idiomelon at the Lity$', title: The Lity, when_slot: vespers.litia, replace: vespers.litia}
  - {id: litia_litany, start: '^The Litany$', title: Litany of the Lity, when_slot: vespers.litia}
  - {id: artoklasia, start: '^D: Let us pray to the Lord\.$', title: Artoklasia, keep_first: true, when_slot: vespers.litia}
  - id: aposticha
    start: '^Aposticha\b'
    title: Aposticha
    replace: vespers.aposticha
    music: [{key: aposticha, title: Aposticha, dcs: '^(aposticha\d|aposglory)'}]
  - {id: nunc_dimittis, start: '^Song of Symeon the God-Receiver$', title: Song of Symeon}
  - {id: trisagion, start: '^The Trisagion$', title: Trisagion Prayers}
  - id: apolytikia
    start: '^Apolytikion\b'
    title: Apolytikia
    replace: vespers.apolytikia
    music: [{key: apolytikion, title: Apolytikion, dcs: '^apolytikion\d*\.'}]
  - {id: closing, start: '^D: Let us pray to the Lord\.$', title: The Blessing, keep_first: true}
  - {id: dismissal, start: '^The Dismissal$', title: The Dismissal}
