# ANCA answer key (yocal_rules/anca.py) reads the Epistle block's subtitle; the Rules in rules/anca_norms.yaml follow the
# prokeimenon text ANCA actually prints under it (parish decision 2026-11-12: follow ANCA for the prokeimena).
# Known difference (text level, not caught by the subtitle key): St Menas, Nov 11 on a Sunday. ANCA 2018-11-11 printed the
# Tone 7 Sunday prokeimenon under '(For St. Menas)'; the Rules give St Menas's own (calendar Epistle). Single sample; re-check 2029.
- slot: liturgy.prokeimenon
  source: anca
  scope: {mmdd: ["02-09"]}
  ours: {owner: feast}
  theirs: {owner: sunday}
  class: anca_subtitle_sunday_prints_feast
  reason: "ANCA 2020-02-09 and 2025-02-09 subtitle '(For Sunday of the Pharisee and Publican)' but the text is the Presentation's ('My soul doth magnify the Lord'); Rule lit.prokeimenon.presentation_leavetaking follows the text."
- slot: liturgy.prokeimenon
  source: anca
  scope: {mmdd: ["09-15", "09-16", "09-17", "09-18", "09-19", "09-20", "09-21"]}
  ours: {proper: false}
  theirs: {proper: true}
  class: anca_subtitle_named_prints_tone
  reason: "ANCA 2024-09-15, 2025-09-21, 2026-09-20 subtitle '(For Sunday after the Elevation of the Holy Cross)' but the text is the tone's; Rule lit.prokeimenon.after_elevation_tone.2024 follows the text (2018-2023 printed the Sunday's own)."
# Dismissal on St Menas's Sunday (parish decision 2026-11-12: class patterns only).
- slot: liturgy.dismissal
  source: anca
  scope: {mmdd: ["11-11"]}
  ours: {saint_named: true}
  theirs: {saint_named: false}
  class: anca_single_sample_saint_not_named
  reason: "Known difference, not a Rule: ANCA 2018-11-11 names no saint of the day (only 'Saint N.' the patron); single sample against the 2022-26 majority (lit.dismissal.anca_default). Re-check 2029."
# Readings follow the YOCal DB (CLAUDE.md "YOCal DB is authoritative"): where ANCA differs it is a divergence, not a Rule.
- slot: [liturgy.epistle, liturgy.prokeimenon]
  source: anca
  scope: {date: ["2018-06-10", "2020-06-21", "2021-07-04", "2022-06-26", "2023-06-18"]}
  ours: {owner: saint}
  theirs: {owner: sunday}
  class: anca_antioch_not_yet_kept
  reason: "DB gives the Sunday of All Saints of Antioch its own Epistle (Acts 11:19-30, xM2Sun) every year; ANCA 2018-2023 read the 2nd Sunday's Romans 2:10-16 (commemoration not yet kept)."
- slot: [liturgy.epistle, liturgy.prokeimenon]
  source: anca
  scope: {date: ["2025-06-22", "2026-06-14", "2026-02-01"]}
  ours: {owner: saint}
  theirs: {owner: sunday}
  class: anca_labels_sunday_own_epistle
  reason: "ANCA labels the Epistle for the Sunday ('All Saints of Antioch' 2025-06-22 and 2026-06-14, same Acts 11:19-30 as the DB; 2026-02-01 Tryphon on a Triodion Sunday reads Sunday's own 1 Cor/Romans 3:10-15 where the DB gives the saint's). DB wins; owner label / reading differ."
- slot: [liturgy.author, liturgy.dismissal]
  source: anca
  scope: {date: ["2018-03-25"]}
  ours: {author: "Basil the Great"}
  theirs: {author: "John Chrysostom"}
  class: anca_annunciation_lent_sunday_chrysostom
  reason: "Annunciation on the 5th Sunday of Lent: the DB basil flag says Basil (2018, 2029); ANCA 2018-03-25 and Typikon p.283 say Chrysostom. DB wins (parish decision 2026-11-13)."
