# Hand-written Rules for ordinary Sundays (Sat Great Vespers, Sunday Matins, Sunday Liturgy).
# Typikon = Antiochian Typikon (Khoury/Morris 2011); printed page cited.

# ---- Vespers
- {id: ves.prokeimenon.sat, slot: vespers.prokeimenon, tier: 4, when: [{pred: sunday_eve}],
   fill: {kind: lord_is_king, tone: 6}, source: typikon, locator: "Ch I s3 p.13", status: explicit}
- {id: ves.lihc.two_sets, slot: vespers.lihc.stichera, tier: 3,
   when: [{pred: sunday_eve}, {pred: in_slice}, {pred: two_sets_of_3}], fill: {res: 4, other: [6]},
   source: bpbasil, locator: "Ranking of Feasts: Menaion has two distinct sets of 3 stichera (flag in bpbasil_flags.csv)",
   status: inferred, evidence: "#32: ANCA 4R+6 on 20/36 flagged Sundays vs 2/100 unflagged, 23/26 repeated date keys stable; no Antiochian source states it"}
- {id: ves.lihc.glory, slot: vespers.lihc.stichera, tier: 4,
   when: [{pred: sunday_eve}, {pred: in_slice}, {pred: saint_has_glory}], fill: {res: 6, other: [4]},
   source: typikon, locator: "Ch III p.48 (6R+4 when the saint has a Glory)", status: explicit}
- {id: ves.lihc.no_glory, slot: vespers.lihc.stichera, tier: 4,
   when: [{pred: sunday_eve}, {pred: in_slice}, {pred: saint_no_glory}], fill: {res: 7, other: [3]},
   source: typikon, locator: "Ch III p.48 (7R+3 when the saint has no Glory)", status: explicit}
- {id: ves.lihc.glory_unknown, slot: vespers.lihc.stichera, tier: 4,
   when: [{pred: sunday_eve}, {pred: glory_unknown}], fill: {},
   source: typikon, locator: "Ch III p.48 (input fact saint_has_glory not derivable for this date)",
   status: missing, ticket: "calendar: saint_has_glory (#28/#31)"}
- {id: ves.apolytikia.glory, slot: vespers.apolytikia, tier: 4,
   when: [{pred: sunday_eve}, {pred: in_slice}, {pred: saint_has_glory}], fill: {res_tone: "$tone", saint: true},
   source: typikon, locator: "Ch I s3 p.16 (saint with a Glory at Lord I have cried: Res, Glory saint, Now Theotokion)", status: explicit}
- {id: ves.apolytikia.no_glory, slot: vespers.apolytikia, tier: 4,
   when: [{pred: sunday_eve}, {pred: in_slice}, {pred: saint_no_glory}], fill: {res_tone: "$tone", saint: false},
   source: typikon, locator: "Ch I s3 p.16 (saint without a Glory: Res and Theotokion only)", status: explicit}

# ---- Matins
- {id: mat.apolytikia.glory, slot: matins.apolytikia, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_has_glory}], fill: {res_tone: "$tone", saint: true},
   source: typikon, locator: "Ch I s3 p.16", status: explicit}
- {id: mat.apolytikia.no_glory, slot: matins.apolytikia, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_no_glory}], fill: {res_tone: "$tone", saint: false},
   source: typikon, locator: "Ch I s3 p.16", status: explicit}
- {id: mat.kathismata.res, slot: matins.kathismata, tier: 4, when: [{pred: sunday}],
   fill: {tone: "$tone"}, source: typikon, locator: "Ch I s5 p.21-22; Ch III p.50", status: explicit}
- {id: mat.prokeimenon.res, slot: matins.prokeimenon, tier: 4, when: [{pred: sunday}],
   fill: {kind: resurrectional, tone: "$tone"}, source: typikon, locator: "Ch I s5 p.25", status: explicit}
- {id: mat.eothinon.calendar, slot: matins.eothinon_gospel, tier: 4, when: [{pred: sunday}],
   fill: {number: "$eothinon"}, source: typikon, locator: "Ch I s5 p.29 fn21 (rotation deferred to calendar)", status: explicit}
- {id: mat.kontakion.undecided, slot: matins.kontakion, tier: 4, when: [{pred: sunday}], fill: {},
   source: typikon, locator: "Matins kontakion Rules are in kontakion.yaml; fallback for days they do not cover (Palm Sunday; Pascha has pent.pascha.mat.kontakion)", status: missing, ticket: "#27"}
- {id: mat.praises.plain, slot: matins.praises, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: no_saint_in_calendar}], fill: {total: 8, res: 8},
   source: typikon, locator: "Ch III p.50-51", status: explicit}
- {id: mat.praises.saint, slot: matins.praises, tier: 4,
   when: [{pred: sunday}, {pred: saint_in_calendar}], fill: {},
   source: typikon, locator: "Ch I s5 p.31 'counts unstated'", status: missing, ticket: "tbd (praises with a saint)"}

# ---- Liturgy
- {id: lit.apolytikia.glory, slot: liturgy.apolytikia, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_has_glory}], fill: {res_tone: "$tone", saint: true},
   source: typikon, locator: "Ch I s3 p.16", status: explicit}
- {id: lit.apolytikia.no_glory, slot: liturgy.apolytikia, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_no_glory}], fill: {res_tone: "$tone", saint: false},
   source: typikon, locator: "Ch I s3 p.16", status: explicit}
- {id: lit.kontakion.other, slot: liturgy.kontakion, tier: 4,
   when: [{pred: sunday}], fill: {},
   source: typikon, locator: "Liturgy kontakion windows are in kontakion.yaml; fallback for days they do not cover (Palm Sunday, ...; Pascha is lit.kontakion.pascha_cycle)", status: missing,
   ticket: "#25 (kontakion windows)"}
- {id: lit.epistle.owner, slot: liturgy.epistle, tier: 4, when: [{pred: sunday}],
   fill: {owner: "$epistle_owner", ref: "$epistle_ref"}, source: typikon,
   locator: "Ch I s6 p.37-38 (great saint on Sunday: saint's Epistle)", status: explicit}
- {id: lit.epistle.anca_sunday, slot: liturgy.epistle, tier: 3,
   when: [{pred: sunday}, {pred: anca_sunday_epistle}],
   fill: {owner: sunday, ref: "$sunday_epistle_ref"},
   source: anca, locator: "inferred: ANCA reads the Sunday's own Epistle on All Saints / Triodion Sundays and leavetakings",
   status: inferred, evidence: "ANCA READ 2022-2026: 7 Sundays where the calendar flag said saint (All Saints of Antioch 2022 and 2023 only; 2025+ is lit.epistle.antioch_own.2025, Apostles synaxis 2024-06-30, Theophany leavetaking 2024-01-14, Tryphon on Triodion 2026-02-01); ANCA's reading equals the DB a_code lection each time",
   conflict: {with: [lit.epistle.owner], status: open,
              note: "Calendar flag (is_comm_apos) and Typikon p.37-38 give the saint's Epistle on a great saint's Sunday. ANCA reads the Sunday's own Epistle on All Saints Sundays (incl. All Saints of Antioch), Triodion Sundays and leavetakings: calendar flag right on 173/182 Sundays, this rule 180/182. The Leavetaking and Triodion clauses each rest on one date with a counterexample (2026-01-11, 2025-03-09): low confidence. Project default: follow ANCA."}}
- {id: lit.epistle.antioch_own.2025, slot: liturgy.epistle, tier: 2,
   when: [{pred: sunday}, {pred: desig_contains, args: ["All Saints of Antioch"]}, {pred: year_at_least, args: [2025]}, {pred: not_date_in, args: ["07-07"]}],
   fill: {owner: sunday, ref: "$epistle_ref"},
   source: anca, locator: "inferred: from 2025 ANCA reads the Sunday of All Saints of Antioch's own Epistle (Acts 11:19-30, 'For Sunday of All Saints of Antioch'), the DB's xM2Sun lection",
   status: inferred, evidence: "ANCA READ 2025-06-22 and 2026-06-14 (both Acts 11:19-30 = DB c_code xM2Sun, subtitled for the Sunday itself); 2022-06-26 and 2023-06-18 read the 2nd Sunday's Romans 2:10-16 (commemoration not yet kept, as in lit.kontakion antioch year clause)",
   conflict: {with: [lit.epistle.owner], status: open,
              note: "Typikon p.37-38 gives the saint's Epistle on a great saint's Sunday; the DB lection is the commemoration's own, so the reading agrees but ANCA labels it the Sunday's own. Project default: follow ANCA (the Church's own saints get preference). The 2022-23 Sundays stay on lit.epistle.anca_sunday."}}
- {id: lit.prokeimenon.anca_sunday, slot: liturgy.prokeimenon, tier: 3,
   when: [{pred: sunday}, {pred: anca_sunday_epistle}],
   fill: {owner: sunday},
   source: anca, locator: "inferred: the prokeimenon follows the Epistle owner",
   status: inferred, evidence: "as lit.epistle.anca_sunday; ANCA shows the owner only via the Epistle subtitle (circular check)",
   conflict: {with: [lit.prokeimenon.follows_epistle], status: open, note: "see lit.epistle.anca_sunday"}}
- {id: lit.gospel.calendar, slot: liturgy.gospel, tier: 4, when: [{pred: sunday}],
   fill: {ref: "$gospel_ref"}, source: typikon, locator: "Ch I s6 p.37 (lectionary deferred to calendar)", status: explicit}
- {id: lit.prokeimenon.follows_epistle, slot: liturgy.prokeimenon, tier: 4, when: [{pred: sunday}],
   fill: {owner: "$epistle_owner"}, source: anca, locator: "inferred, issue 'Prokeimenon and alleluia verse rules'",
   status: inferred, evidence: "ANCA READ 16 dates, DCS 5; Violakis p.58 says 'the Prokeimena' only"}
- {id: lit.prokeimenon.named_sunday, slot: liturgy.prokeimenon, tier: 1,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: desig_contains, args: ["Forefathers", "before the Nativity", "After the Nativity", "after the Nativity", "before the Theophany", "after the Theophany", "before the Elevation", "after the Elevation", "Fathers of the"]}],
   fill: {owner: sunday, proper: true}, source: anca,
   locator: "inferred: a named Sunday (Forefathers, before/after the Nativity, Theophany or Elevation, Holy Fathers, All Saints) has its own prokeimenon, labelled '(For the Sunday before the Nativity)', '(For the Holy Forefathers)' etc.",
   status: inferred, evidence: "ANCA READ 2022-2026, 242 Sundays: of 54 named Sundays, 47 carry the Sunday's own name on the Epistle block (the proper), 7 the 'Nth Sunday after Pentecost' tone label; Typikon Ch I s6 is silent on the Liturgy prokeimenon",
   conflict: {with: ["Digital Chant Stand 2026-12-27"], status: open, note: "Sunday after the Nativity falling on Dec 27 (St Stephen): ANCA 2025-12-28 prints the Sunday's own ('God is wondrous in His saints'); the DCS page for 2026-12-27 gives St Stephen's prokeimenon. Project default: follow ANCA when it has a file."}}
- {id: lit.prokeimenon.all_saints, slot: liturgy.prokeimenon, tier: 1,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: desig_contains, args: ["Sunday of All Saints"]}, {pred: not_desig_contains, args: ["of All Saints of"]}],
   fill: {owner: sunday, proper: true}, source: anca,
   locator: "inferred: the Sunday of All Saints has its own prokeimenon ('God is wondrous in His saints'); the regional All Saints Sundays (Antioch, North America, British Isles) take the tone of the week's",
   status: inferred, evidence: "ANCA READ 2022-06-19, 2023-06-11, 2025-06-15, 2026-06-07 (All Saints: 'God is wondrous in His saints'); 2022-06-26, 2023-06-18, 2025-06-22, 2026-06-14 (regional All Saints: tone of the week)"}
- {id: lit.prokeimenon.tone_sunday, slot: liturgy.prokeimenon, tier: 2,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: epistle_owner_is, args: [sunday]}, {pred: not_desig_contains, args: ["Forefathers", "before the Nativity", "After the Nativity", "after the Nativity", "before the Theophany", "after the Theophany", "before the Elevation", "after the Elevation", "Fathers of the"]}],
   fill: {owner: sunday, proper: false}, source: anca,
   locator: "inferred: an ordinary Sunday whose Epistle is the Sunday's has the tone of the week's prokeimenon (ANCA: '(For the Nth Sunday after Pentecost)')",
   status: inferred, evidence: "ANCA READ 2022-2026: 63 of 65 plain Sundays and 19 of 20 fore/after-feast-period Sundays are labelled '(For the Nth Sunday after Pentecost)'; Typikon silent; Triodion/Lent/Pascha Sundays are covered by their own Rules"}
- {id: lit.alleluia.t2, slot: liturgy.alleluia, tier: 4, when: [{pred: sunday}], fill: {tone: 2},
   source: typikon, locator: "Ch I s6 p.38", status: explicit}
- {id: lit.alleluia.day_tone, slot: liturgy.alleluia, tier: 3, when: [{pred: sunday}, {pred: tone_known}], fill: {tone: "$tone"},
   source: parish, locator: "parish choir booklets 2025-26: Alleluia and its verses in the tone of the week (Typikon Ch I s6 VIII p.38 says Tone 2)",
   status: inferred, evidence: "booklets 2025-11-16 (T6), 11-23 (T7), 12-07 (T1), 12-14 (T2), 2026-11-08 (T6): Alleluia chanted in the day's tone; 2025-12-21 (T3 Sunday) used Tone 4; DCS li2 pages give the verses per Sunday tone",
   conflict: {with: [lit.alleluia.t2], status: decided, note: "DIVERGENCE FROM THE TYPIKON (decided by the parish choir director, 2026-11): Typikon Ch I s6 VIII p.38 has the Alleluia in Tone 2 at every Liturgy; the parish uses the tone of the week, for the chant and for the verses. The Typikon Rule lit.alleluia.t2 is kept as the shadowed alternative."}}
- {id: lit.dismissal.not_named.01-05, slot: liturgy.dismissal, tier: 1,
   when: [{pred: sunday}, {pred: menaion_date_is, args: ["01-05"]}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "none (Lord's/Theotokos feast period)"},
   source: anca, locator: "inferred: ANCA names no saint on Theophany eve", status: inferred,
   evidence: "ANCA READ 2025-01-05"}
- {id: lit.dismissal.not_named.01-14, slot: liturgy.dismissal, tier: 1,
   when: [{pred: sunday}, {pred: menaion_date_is, args: ["01-14"]}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "none (Lord's/Theotokos feast period)"},
   source: anca, locator: "inferred: ANCA names no saint at the Theophany leavetaking", status: inferred,
   evidence: "ANCA READ 2024-01-14"}
- {id: lit.dismissal.not_named.06-29, slot: liturgy.dismissal, tier: 1,
   when: [{pred: sunday}, {pred: menaion_date_is, args: ["06-29"]}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "none (Peter and Paul)"},
   source: anca, locator: "inferred: ANCA names no saint on Peter and Paul", status: inferred,
   evidence: "ANCA READ 2025-06-29"}
- {id: lit.dismissal.not_named.08-31, slot: liturgy.dismissal, tier: 1,
   when: [{pred: sunday}, {pred: menaion_date_is, args: ["08-31"]}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "none (Placing of the Sash)"},
   source: anca, locator: "inferred: ANCA names no saint at the Placing of the Sash", status: inferred,
   evidence: "ANCA READ 2025-08-31"}
- {id: lit.dismissal.anca_default, slot: liturgy.dismissal, tier: 3,
   when: [{pred: sunday}, {pred: in_slice}],
   fill: {author: "$liturgy_author", saint_named: true, named_as: "the saint of the day (principal, else first other commemoration)"},
   source: anca, locator: "inferred: ANCA names the day's saint in the dismissal on almost every Sunday",
   status: inferred, evidence: "ANCA READ 2022-2026: named on 103/116 in-scope Sundays (102 by the original parse); the rule gets 109/116 with the exceptions above; the seven misses are generic Fathers/All Saints Sundays (Divergence log)",
   conflict: {with: [lit.dismissal.glory, lit.dismissal.no_glory], status: open,
              note: "Typikon p.17 (Great Dismissal): saint of the day named only 'if it has a Doxastikon'; the Little Dismissal names it unconditionally. Meaning of 'Doxastikon' (Vespers Glory only, or any Glory hymn: Aposticha, Praises) is unresolved. ANCA names a saint on 102/116 in-scope Sundays 2022-26 (our Typikon reading 61% right, wider Doxastikon reading 67%). Project default: follow ANCA; Typikon reading kept as the shadowed alternative."}}
- {id: lit.dismissal.glory, slot: liturgy.dismissal, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_has_glory}], fill: {author: "$liturgy_author", saint_named: true},
   source: typikon, locator: "Ch I s4 p.17 (saint of the day named if it has a Doxastikon; Liturgy author named)", status: explicit}
- {id: lit.dismissal.sunday_named, slot: liturgy.dismissal, tier: 2,
   when: [{pred: sunday}, {pred: desig_contains, args: ["Forefathers", "All Saints of Antioch"]}],
   fill: {author: "$liturgy_author", saint_named: true, named_as: "the Sunday's own commemoration"},
   source: anca, locator: "inferred: dismissal names the Sunday's own feast (Holy Forefathers, All Saints of Antioch)",
   status: inferred, evidence: "ANCA READ: Forefathers Sunday 2022-2025 (4/4), All Saints of Antioch 2025-06-22 and 2026-06-14; Typikon p.17 only covers a saint with a Doxastikon"}
- {id: lit.dismissal.archangel, slot: liturgy.dismissal, tier: 2,
   when: [{pred: sunday}, {pred: archangel_feast}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "the Archangel feast, in the bodiless-powers clause"},
   source: anca, locator: "inferred: an Archangel feast is named in the bodiless-powers clause; the saint slot is left empty",
   status: inferred, evidence: "ANCA READ 2026-09-06 (Archangel Michael at Colossae) and 2026-11-08 (Synaxis of the Archangels); Typikon p.17 template has the bodiless-powers clause"}
- {id: lit.dismissal.no_glory, slot: liturgy.dismissal, tier: 4,
   when: [{pred: sunday}, {pred: in_slice}, {pred: saint_no_glory}], fill: {author: "$liturgy_author", saint_named: false},
   source: typikon, locator: "Ch I s4 p.17", status: explicit}

