   fill: {res: 6, other: [4]}, source: typikon, locator: "Jul 13-19 Sunday of the Fathers of the 4th Council, p.432 (6R+4, Glory for the Fathers)", status: explicit,
   conflict: {with: ["Typikon p.12 (4R+6 list)"], status: open, note: "Typikon p.12 lists 4R+6 for the Fathers of the 4th and 7th Councils; p.432 gives 6R+4. ANCA follows p.432 (6R+4 on 4 of 5 Sundays 2022-26; the fifth is a 4R+3+3 merge)."}}
- {id: ves.lihc.named.fathers_7th, slot: vespers.lihc.stichera, tier: 0, when: [{pred: sunday_eve}, {pred: in_slice}, {pred: named_sunday_is, args: [fathers_7th_council]}],
