   source: typikon, locator: "Sep 8 p.67, Feb 2 p.218, Nov 21 p.113, Aug 15 p.457 (Resurrection 1x, feast 2x)", status: explicit}
- {id: mf.sun.ves.readings, slot: vespers.readings, tier: -10,
   when: [{pred: sunday_feast_order, args: [nativity_theotokos, presentation, entrance, dormition]}],
   fill: {count: 3, parts: ["3 Old Testament readings of the feast — Menaion {mmdd}"]},
   source: typikon, locator: "readings of the feast after the Entrance: Sep 8 p.66, Feb 2 p.218, Nov 21 p.113, Aug 15 p.457; count from the Menaion",
