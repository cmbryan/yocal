# Work package I (cont.): Sunday occurrence of a fixed Major feast of the Theotokos class (Nativity of the Theotokos Sep 8, Presentation Feb 2,
# Entrance Nov 21, Dormition Aug 15), ordinary season only (predicate sunday_feast_order). Sat Great Vespers = the eve; Matins; Liturgy.
# Enabled in slices.yaml ('mm-dd:sunday') only where a cached ANCA text verifies it: Sep 8 (2019, 2024), Feb 2 (2020, 2025), Nov 21 (2021), Aug 15 (2021).
# Not covered: Transfiguration (Aug 6) and Elevation (Sep 14) on Sunday (no ANCA text), Annunciation, Nativity, Theophany, Presentation on a Triodion Sunday (Typikon p.220 alt. order).
# Typikon = Antiochian Typikon (Khoury/Morris 2011), printed page. Sunday orders: Sep 8 pp.66-68, Feb 2 pp.218-220, Nov 21 pp.113-114, Aug 15 pp.457-458.
# General Sunday-feast rules: Ch I s5 V p.25 (kathismata), VI p.25-26 (evlogetaria), XV p.30 (praises); Ch I s6 I-III pp.34-35 (Beatitudes, antiphons, entrance hymn).
# Issue decisions (#39, #42, #43): Presentation Vespers 4R+6 follows ANCA (conflict accepted); Matins evlogetaria follow ANCA (conflict accepted).
# Other slots of these days (Vespers prokeimenon, Matins kontakion/katavasia) are resolved by the general Sunday and kontakion/major_feasts Rules.

# ================= Great Vespers (Saturday evening) =================
- {id: mf.sun.ves.lihc.theotokos, slot: vespers.lihc.stichera, tier: -10,
   when: [{pred: sunday_feast_order, args: [nativity_theotokos, entrance, dormition]}],
   fill: {res: 4, other: [6], parts: ["4 stichera of the Resurrection — Octoechos Tone {tone}", "6 stichera of the feast — Menaion {mmdd} (3 idiomela each twice for the Dormition)", "Glory, Now: doxastikon of the feast"]},
   source: typikon, locator: "Sep 8 p.66, Nov 21 p.113, Aug 15 p.457 (10 stichera: 4 Resurrection + 6 feast, Glory/Now feast)", status: explicit}
- {id: mf.sun.ves.lihc.presentation, slot: vespers.lihc.stichera, tier: -10,
   when: [{pred: sunday_feast_order, args: [presentation]}],
   fill: {res: 4, other: [6], parts: ["4 stichera of the Resurrection — Octoechos Tone {tone}", "6 stichera of the Presentation — Menaion {mmdd}", "Glory, Now: doxastikon of the feast"]},
   source: anca, locator: "inferred: 4R+6 as the Typikon's own Theotokos-feast Sunday pattern (Sep 8 p.66, Nov 21 p.113, Aug 15 p.457) and the Presentation's Matins praises (p.219)", status: inferred,
   evidence: "ANCA Great Vespers 2020-02-01 and 2025-02-01: 4 Resurrection + 6 feast verses; Violakis §7 groups the Meeting with the Theotokos feasts (4R+6); #42 research",
   conflict: {with: ["Typikon Feb 2 p.218 (Sunday order: 6 Resurrection + 4 Presentation + Glory)"], status: accepted,
              note: "p.218 is an outlier against the Typikon's own Theotokos-feast Sunday pattern (pp.66, 113, 457) and its Presentation Matins 4R+4 (p.219); ANCA 2020 and 2025 and Violakis §7 give 4R+6. Project default: follow ANCA (#42)."}}
- {id: mf.sun.ves.apolytikia, slot: vespers.apolytikia, tier: -10,
   when: [{pred: sunday_feast_order, args: [nativity_theotokos, presentation, entrance, dormition]}],
