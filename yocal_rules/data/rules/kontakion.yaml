   fill: {kind: feast, owner: "All Saints of Antioch"}, source: anca, locator: "inferred: ANCA-local commemoration, not in the Typikon",
   status: inferred, evidence: "ANCA ORTHROS 2025-06-22 and 2026-06-14 print its own kontakion and oikos (#27 divergence 4); 2022-24 print the resurrectional only (commemoration not yet kept), hence the year clause"}
