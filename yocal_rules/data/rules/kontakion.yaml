# Sunday kontakion Rules (#27 Matins 6th-ode kontakion; #25 Liturgy kontakion windows; #19 Liturgy author).
# Typikon = Antiochian Typikon (Khoury/Morris 2011) printed page; Violakis = 1888 Typikon (local translation) section.
# Tiers (Matins rules sit one tier lower than the Liturgy ones; default resurrectional = 3): 0-1 movable (Pascha-relative) overrides, 2 single-date exceptions, 3 fixed date windows/lists; placeholders in
# sunday_general.yaml (tier 4, status missing) remain only for days these Rules do not cover (Palm Sunday, Pascha, Lord's-feast Sundays).

# ================= Matins kontakion (resurrectional by default; feast's replaces it) =================
- {id: mat.kontakion.default, slot: matins.kontakion, tier: 3, when: [{pred: sunday}],
   fill: {kind: resurrectional, tone: "$tone"}, source: typikon, locator: "Ch I s10 p.28 (Octoechos kontakion; Violakis §26 p.21)", status: explicit}
- {id: mat.kontakion.triodion, slot: matins.kontakion, tier: 1,
   when: [{pred: sunday}, {pred: pascha_days_between, args: [-70, -49]}],
   fill: {kind: feast, owner: "the Triodion Sunday's own"}, source: typikon, locator: "Ch I s10 p.28 (Triodion Sundays except Lent 2, 4, 5); Violakis §26", status: explicit}
- {id: mat.kontakion.lent_1_3, slot: matins.kontakion, tier: 1,
   when: [{pred: sunday}, {pred: pascha_days_between, args: [-42, -42]}],
   fill: {kind: feast, owner: "Sunday of Orthodoxy (Lent 1)"}, source: typikon, locator: "Ch I s10 p.28 (Triodion Sundays except Lent 2, 4, 5)", status: explicit}
- {id: mat.kontakion.lent_3, slot: matins.kontakion, tier: 1,
   when: [{pred: sunday}, {pred: pascha_days_between, args: [-28, -28]}],
   fill: {kind: feast, owner: "Lent 3 (Veneration of the Cross)"}, source: typikon, locator: "Ch I s10 p.28 (Triodion Sundays except Lent 2, 4, 5)", status: explicit,
   conflict: {with: [mat.kontakion.default], status: open, note: "ANCA Abbr 2025-03-23 prints the resurrectional kontakion on Lent 3 but the full ORTHROS file prints the Lent 3 kontakion (same as every other year 2022-26). The full ORTHROS file is used as key."}}
- {id: mat.kontakion.pentecostarion, slot: matins.kontakion, tier: 1,
