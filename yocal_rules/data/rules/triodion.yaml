# Work package F: Triodion and Great Lent Sundays (Publican .. Cheesefare, Lent 1-5, Palm Sunday): Saturday Great Vespers,
# Sunday Matins and Liturgy. Gated on pascha_days (liturgical Sunday - Pascha): -70 Publican, -63 Prodigal, -56 Meatfare,
# -49 Cheesefare, -42 Lent 1 (Orthodoxy), -35 Lent 2 (Palamas), -28 Lent 3 (Cross), -21 Lent 4 (Climacus), -14 Lent 5 (Mary of
# Egypt), -7 Palm Sunday. Typikon = Antiochian Typikon (Khoury/Morris 2011), printed page (footer number).
# Tiers (negative: these beat every generic/date-window Rule on these Sundays):
#   -1 the Sunday's own order; -2 catch-all `missing` when a Menaion commemoration / fore-afterfeast shares the Sunday
#   (Typikon Ch V has per-date 'Sunday of the Triodion' orders not encoded here); -3 coincidences encoded from Ch V.
# Reused, not duplicated: kontakion.yaml (Triodion/Lent kontakia, Liturgy author incl. Annunciation exception), the
# calendar-driven Epistle/Gospel Rules in sunday_general.yaml, matins kathismata/prokeimenon/eothinon generic Rules.

