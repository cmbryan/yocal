# Work package I: Major feasts (GLOSSARY 'Major feast') and their eve Great Vespers.
# Gated on the major_feast fact (calfacts.major_feast: normalised id), independent of in_slice. This file covers a feast falling
# on a weekday or Saturday (feast_on_weekday; Vespers = the eve, Sunday-Friday evening). Sunday coincidence is NOT covered here:
# slices.yaml lists 'mm-dd:sunday' only when a Sunday order exists. Palm Sunday, Pentecost: triodion.yaml / pentecostarion.yaml.
# Typikon = Antiochian Typikon (Khoury/Morris 2011), printed page; Ch I s6 = Liturgy general rules pp.33-40.
# ANCA = the festal service texts ('Great Vespers of <date>', 'Festal Orthros', 'Liturgy Variables') of the 2025-26 church year.
# Weekday-feast Vespers/Matins for most feasts: the Typikon says 'follow the Menaion' (p.111, 164, 218, 449); the Menaion is not
# available to this project, so Menaion-dependent counts/tones are inferred from the ANCA texts and flagged as such.

# ================= Great Vespers (eve) =================
# Annunciation eve (a Lenten weekday, never Holy Week/Bright Week in the Gregorian-Pascha range): Rules mf.ves.ann.* below, enabled
# only for an eve on Sunday (Monday feast) or Tuesday (Wednesday feast) via slices.yaml supported_major_eve_vespers: ANCA 2019, 2026 (and the 2020
# Readers Vespers) agree (6 feast stichera, 3 readings, Litia, feast aposticha, apolytikion thrice). Monday, Wednesday, Thursday, Friday eves
# (2025, 2021, 2022, 2023) have no ANCA eve text (2023 Fri: only a Presanctified Liturgy with Small Vespers): Incomplete. The Annunciation feast
# day's Matins/Liturgy are enabled for Monday (ANCA 2019) and Wednesday (ANCA 2026) only ('03-25:Monday'/'03-25:Wednesday' in supported_fixed_major).
# Saturday eve before a Sunday feast: Lent 5 only, major_feasts_annunciation_lent5.yaml (ANCA 2018).
# Typikon Ch V Mar 25 Lenten table (p.276-295) defers the eve to 'the order found in the Menaion' (no counts) and gives its Lenten-frame
# Vespers (Triodion stichera, Great Prokeimenon, Lenten ending) for the forefeast eve; ANCA is followed, Typikon reading logged as conflict.
- {id: mf.ves.ann.lihc, slot: vespers.lihc.stichera, tier: -10,
   when: [{pred: feast_on_weekday}, {pred: major_feast_is, args: [annunciation]}],
   fill: {res: 0, other: [6], parts: ["6 stichera of the Annunciation (no resurrectional stichera) — Menaion 03-25", "Glory, Now: doxastikon of the Annunciation"]},
   source: anca, locator: "inferred: Typikon Ch V Mar 25 p.283-286, p.294-295 defers the eve to the Menaion",
   status: inferred, evidence: "ANCA Great Vespers of March 24 (2019, Sunday eve) and of March 25 (2026, Tuesday eve; Readers Vespers 2020, Tuesday eve): 6 hymn-bearing verses, all for the feast, doxastikon of the feast",
   conflict: {with: ["Typikon Ch V Mar 25 Lenten table p.283 (Mon wk4: 'Sunday evening ... the service in the Menaion'), p.284 (feast headed 'Tuesday', Vespers Monday evening: 10 stichera = 7 Triodion + 3 forefeast, Great Prokeimenon, Triodion aposticha, Lenten ending), p.286 (Wed/Thu wk4/6: eve per the Menaion), p.294-295 (Mon wk5/6, Wed wk5: eve per the Menaion)"], status: open,
              note: "Typikon gives no eve counts ('the order found in the Menaion') and shows a Lenten-frame Vespers (Triodion stichera, Great Prokeimenon, Presanctified when the forefeast is Wed/Fri, p.277) for the evening before the forefeast; its 'Tuesday' heading (p.283-284) is inconsistent with its own text (forefeast on Tuesday, feast Wednesday). ANCA 2019 (Sunday eve) and 2026 (Tuesday eve) print a plain festal Vespers: 6 feast stichera, daily prokeimenon, 3 readings, Litia, feast aposticha and apolytikion, no Lenten ending. Project default: follow ANCA."}}
