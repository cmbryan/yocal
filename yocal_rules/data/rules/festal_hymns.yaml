   fill: {of: mov/-42, refrain2: resurrection},
   source: typikon, locator: "Ch VI p.487-488 (antiphons of the Sunday of Orthodoxy; 3rd refrain its troparion “We reverence Thine Immaculate Icon”)", status: explicit}
- {id: lit.antiphons.lent3, slot: liturgy.antiphons, tier: 1, when: [{pred: sunday}, {pred: pascha_days_between, args: [-28, -28]}],
   fill: {of: mov/-28, refrain2: resurrection},
   source: typikon, locator: "Ch VI p.492-493 (antiphons of the 3rd Sunday of Lent; 3rd refrain the troparion of the Holy Cross)", status: explicit}
- {id: lit.trisagion.lent3, slot: liturgy.trisagion, tier: 1, when: [{pred: sunday}, {pred: pascha_days_between, args: [-28, -28]}],
   fill: {kind: cross}, source: typikon, locator: "Ch I s6 VI p.37; Ch VI p.493 (“Before thy cross”)", status: explicit}
- {id: lit.antiphons.palm, slot: liturgy.antiphons, tier: 1, when: [{pred: sunday}, {pred: pascha_days_between, args: [-7, -7]}],
   fill: {refrain2: feast}, source: typikon, locator: "Ch VI p.505 (the antiphons for Palm Sunday)", status: explicit}
- {id: lit.eisodikon.palm, slot: liturgy.eisodikon, tier: 1, when: [{pred: sunday}, {pred: pascha_days_between, args: [-7, -7]}],
   fill: {kind: feast, ending: feast},
   source: typikon, locator: "Ch VI p.505 (“Blessed is he who cometh … Save us O Son of God who didst sit upon the foal of an ass”)", status: explicit}
- {id: lit.megalynarion.palm, slot: liturgy.megalynarion, tier: 1, when: [{pred: sunday}, {pred: pascha_days_between, args: [-7, -7]}],
   fill: {kind: feast}, source: typikon, locator: "Ch VI p.505 (heirmos of the 9th ode of the canon for Palm Sunday, “God the Lord hath appeared unto us”)", status: explicit}

