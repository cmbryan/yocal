# Work package G: Pentecostarion Sundays (Thomas .. Pentecost, pascha_days 7..49) and Pascha (pascha_days 0).
# Typikon = Antiochian Typikon (Khoury/Morris 2011), Ch VII; printed page = the 'Back to Table of Contents N' footer that closes the page.
# Hymns are referenced by placeholder only (no Pentecostarion text, HANDOFF known gap); `parts` is what the service document prints.
# Tiers: -1 Ch V coincidence orders with a great saint (date-specific); 0 the Sunday's own order (gated off the coincidence dates
# with not_date_in) and the catch-all 'missing' for coincidences not encoded; 5 shadowed ANCA alternatives (conflict notes).
# Slots not listed here fall to the generic Rules: vespers.prokeimenon ('The Lord is king', Ch I p.13), matins.eothinon_gospel
# (calendar eothinon = Ch VII numbers 1/4/5/7/8/10), matins.prokeimenon (resurrectional, Myrrhbearers..Fathers), kontakia
# (kontakion.yaml), liturgy.epistle / gospel (calendar; owner flag), liturgy.alleluia (tone 2, Ch I p.38), liturgy.author.
# Coincidence dates with their own Ch V order on a Pentecostarion Sunday (COINC): George 04-23 (pp.328-336), Mark 04-25,
# Athanasius 05-02, John the Theologian 05-08 (pp.364-), Constantine and Helen 05-21 (pp.388-), 3rd Finding of the Forerunner's
# Head 05-25 (pp.404-), Nativity of the Forerunner 06-24 (can fall on Pentecost). Lesser saints are not sung on these Sundays
# (ANCA 2019-26: James 04-30, Simeon 05-10, Metrophanes 06-04 etc. leave the Sunday order unchanged).

# ======================= Thomas Sunday (pascha_days 7; no Octoechos, Resurrection service omitted) =======================
