   fill: {count: 3, parts: ["3 Old Testament readings of the Annunciation (Genesis 28:10-17; Ezekiel 43:27-44:4; Proverbs 9:1-11) — Menaion 03-25"]},
   source: typikon, locator: "Ch V Mar 25 p.291, p.305 (the readings for the Annunciation); count from the Menaion", status: inferred,
   evidence: "count: ANCA Great Vespers 2018-03-24: 3 readings (as ANCA 2019-03-24 and 2026-03-24)"}
- {id: mf.lent5.ves.litia, slot: vespers.litia, tier: -10,
