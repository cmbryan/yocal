# Work package I (cont.): Annunciation (Mar 25) on the 5th Sunday of Great Lent (pascha_days -14). Sat Great Vespers = the eve; Matins; Liturgy.
# Enabled in slices.yaml as "03-25:sunday@-14", verified against ANCA 2018-03-24 (Vespers), 2018-03-25 (Orthros, Liturgy Variables). Lent 3/4/6 and
# Palm Sunday coincidences stay disabled (no ANCA text). Rules below shadow the 'missing' placeholders tri.annunciation.* and tri.*.coincidence.
# Typikon Ch V Mar 25 on Lent 5 p.302-306 says 'we celebrate the order for the 4th Sunday' (printed p.305-306 and, identically, p.291-292).
# Ticket #42 verdict: Sat Vespers 4 Resurrection + 6 Annunciation (4th-Sunday order p.291; ANCA 2018); p.305 prints 6R+4 under the same heading (accepted conflict).
# Matins/Liturgy details: p.292 / p.305-306 (the same text); the Divine Liturgy author is lit.author.annunciation_lent_sunday (Chrysostom; #19).

# ================= Great Vespers (Saturday evening) =================
- {id: mf.lent5.ves.lihc, slot: vespers.lihc.stichera, tier: -10,
   when: [{pred: major_feast_is, args: [annunciation]}, {pred: weekday_in, args: [Sunday]}, {pred: pascha_days_between, args: [-14, -14]}],
   fill: {res: 4, other: [6], parts: ["4 stichera of the Resurrection — Octoechos Tone {tone}", "6 stichera of the Annunciation — Menaion 03-25", "Glory, Now: doxastikon of the Annunciation"]},
   source: typikon, locator: "Ch V Mar 25 on Lent 5 p.305 ('the order for the 4th Sunday'), i.e. Lent 4 order p.291 (10 stichera: 4 Resurrection + 6 Annunciation, Glory/Now Annunciation)", status: explicit,
   conflict: {with: ["Typikon Ch V Mar 25 p.305 (printed under the 4th-Sunday heading: 6 Resurrection + 4 Annunciation)"], status: accepted,
              note: "p.305 says 'the order for the 4th Sunday' yet prints 6R+4; the 4th-Sunday order p.291 is 4R+6, as the Typikon's own Theotokos-feast Sunday pattern (pp.66, 113, 457) and ANCA 2018-03-24. Rule 4R+6 (#42)."}}
- {id: mf.lent5.ves.readings, slot: vespers.readings, tier: -10,
