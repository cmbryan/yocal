# Sunday Matins katavasia by the Typikon's "A Schedule for the Katavasia of the Year" (Gloss., p.576-577), ordinary-season Sundays only
# (slots.yaml matins.katavasia, fact katavasia_slot): fixed-date ranges. The Triodion / Pentecostarion katavasiae (Pharisee, Prodigal Son,
# Lent Sundays, Pascha-Ascension-Pentecost) are not written here: those seasons have no katavasia slot yet (gap).
# Ch I s6 XI p.28 (the Theotokos katavasia "I shall open my mouth" from the Cross leavetaking to Nov 21 and on the Sundays after All Saints to Jul 26),
# the Presentation katavasia until its leavetaking (Feb 9), the "feast of the Lord/Theotokos" katavasia on Sundays between forefeast and leavetaking.
# Hymn ids kat/<set> (text: one hymn per set, odes 1,3-9 as parts).

- {id: mat.katavasia.cross_sep, slot: matins.katavasia, tier: 4,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: date_between, args: ["09-01", "09-21"]}],
   fill: {of: cross, parts: ["Katavasia: The Holy Cross"], hymns: [{id: kat/cross, label: "Katavasiae: The Holy Cross", kind: katavasia}]},
   source: typikon, locator: "Gloss. A Schedule for the Katavasia of the Year p.576-577", status: explicit}
- {id: mat.katavasia.theotokos_autumn, slot: matins.katavasia, tier: 4,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: date_between, args: ["09-22", "11-07"]}],
   fill: {of: theotokos, parts: ["Katavasia: The Theotokos (“I shall open my mouth”)"], hymns: [{id: kat/theotokos, label: "Katavasiae: The Theotokos (“I shall open my mouth”)", kind: katavasia}]},
   source: typikon, locator: "Gloss. A Schedule for the Katavasia of the Year p.576-577", status: explicit}
