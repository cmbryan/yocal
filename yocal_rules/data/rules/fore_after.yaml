# ================= Liturgy: Dismissal (saint named?) =================
# Typikon p.17: the saint of the day is named only if it has a Doxastikon; inside a Lord/Theotokos period the Vespers Glory belongs to the feast.
- {id: fa.lit.dismissal.period, slot: liturgy.dismissal, tier: 2,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: no_feast_period_saint},
          {pred: feast_period_in, args: ["*:theophany", "*:presentation", "*:transfiguration", "*:dormition", "*:nativity_theotokos", "*:elevation",
                                         "*:entrance_theotokos", "*:nativity"]}],
   fill: {author: "$liturgy_author", saint_named: false, named_as: "none (the day's saint has no Doxastikon in a feast period)"}, source: typikon,
   locator: "Ch I s4 p.17 (saint of the day named only if it has a Doxastikon); Ch III p.12-13 (the Glory is the feast's)", status: explicit,
   conflict: {with: [lit.dismissal.anca_default], status: open,
              note: "ANCA 2022-23 names the day's minor saints in feast periods (13 Sundays); ANCA 2024-26 never does (15/15 Sundays), agreeing with p.17. The 2022-23 practice is logged as a Divergence (divergence_fore_after.yaml)."}}
- {id: fa.lit.dismissal.period_saint, slot: liturgy.dismissal, tier: 2,
   when: [{pred: sunday}, {pred: season_is, args: [ordinary]}, {pred: feast_period_saint},
          {pred: feast_period_in, args: ["*:theophany", "*:presentation", "*:transfiguration", "*:dormition", "*:nativity_theotokos", "*:elevation",
                                         "*:entrance_theotokos", "*:nativity"]}],
   fill: {author: "$liturgy_author", saint_named: true, named_as: "the great saint of the day (has a Doxastikon)"}, source: typikon,
   locator: "Ch I s4 p.17 (saint with a Doxastikon named); Ch III p.12 (great saint in a Lord's feast period has the Glory)", status: explicit}
- {id: fa.lit.dismissal.nativity_sunday, slot: liturgy.dismissal, tier: 1,
