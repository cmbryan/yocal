   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]},
          {pred: feast_period_in, args: ["*:theophany", "*:presentation", "*:transfiguration", "*:dormition", "*:nativity_theotokos", "*:elevation",
                                         "*:entrance_theotokos", "*:nativity", "leavetaking:nativity_forerunner", "leavetaking:beheading"]}],
   fill: {res_tone: "$tone", saint: true, feast: true}, source: typikon,
   locator: "Ch I s3 p.15-16 (forefeast, Sunday after a feast, leavetaking: Resurrection then the feast's troparion; great saint with a Glory: Resurrection, saint, feast); Ch V Jun 24 p.417, Aug 29 p.466",
   status: explicit}
