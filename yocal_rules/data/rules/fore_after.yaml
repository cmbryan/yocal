   locator: "Sunday before the Nativity on Dec 20-23 p.134 (4R+3 forefeast+3 Forefathers); Sunday after the Nativity Dec 26 p.152, Dec 27 p.154 (4R+3+3); Dec 28-30 p.156 ('follow the Menaion')",
   status: explicit}
- {id: fa.ves.lihc.leavetaking_unlisted, slot: vespers.lihc.stichera, tier: 2,
   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]},
          {pred: feast_period_in, args: ["leavetaking:theophany", "leavetaking:presentation", "leavetaking:transfiguration", "leavetaking:dormition",
                                         "leavetaking:nativity_theotokos", "leavetaking:elevation", "leavetaking:entrance_theotokos", "leavetaking:nativity", "forefeast:presentation",
                                         "forefeast:dormition", "forefeast:nativity_theotokos", "forefeast:elevation", "forefeast:entrance_theotokos"]}],
