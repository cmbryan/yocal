# Work package H: Sundays (and their Saturday Great Vespers) in a fore-feast / after-feast / leavetaking period.
# Gated on the normalised feast_period fact (calfacts.feast_period: 'kind:feast' from the DB fore_after text) and season 'ordinary'
# (Triodion/Lent overlaps belong to the Triodion Rules, Pentecostarion ones to the Pentecostarion Rules). Independent of in_slice.
# Typikon = Antiochian Typikon (Khoury/Morris 2011), printed page. Ch V per-date stichera counts (vespers_lihc_ch5.yaml, tier 1)
# win over the period Rules below (tier 2); named-Sunday apolytikia (tier 2) win over the period apolytikia (tier 3, same answer).
# Feast periods of the Lord / Theotokos covered: theophany, presentation, transfiguration, dormition, nativity_theotokos, elevation,
# entrance_theotokos, nativity. Saints' leavetakings covered: nativity_forerunner (Jun 25), beheading (Aug 30).

# ================= Vespers: "Lord, I have cried" =================
- {id: fa.ves.lihc.afterfeast, slot: vespers.lihc.stichera, tier: 2,
   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]}, {pred: no_feast_period_saint},
          {pred: feast_period_in, args: ["afterfeast:theophany", "afterfeast:presentation", "afterfeast:transfiguration", "afterfeast:dormition",
                                         "afterfeast:nativity_theotokos", "afterfeast:elevation", "afterfeast:entrance_theotokos"]}],
   fill: {res: 6, other: [4], of: [feast]}, source: typikon,
   locator: "Ch III p.12 (Sunday between a Theotokos feast and its leavetaking: 6R+4); Ch V Sunday-after sections: Theophany p.180, Presentation p.223, Nativity of the Theotokos p.70, Elevation p.79, Entry p.114, Transfiguration p.450, Dormition p.461",
   status: explicit}
- {id: fa.ves.lihc.afterfeast_saint, slot: vespers.lihc.stichera, tier: 2,
   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]}, {pred: feast_period_saint},
          {pred: feast_period_in, args: ["afterfeast:theophany", "afterfeast:presentation", "afterfeast:transfiguration", "afterfeast:dormition",
                                         "afterfeast:nativity_theotokos", "afterfeast:elevation", "afterfeast:entrance_theotokos"]}],
   fill: {res: 4, other: [3, 3], of: [feast, saint]}, source: typikon,
   locator: "Ch III p.12 (great saint on a Sunday following a feast of the Lord: 4R+3 feast+3 saint); Jan 7 p.179, Holy Napkin Aug 16 p.460",
   status: explicit}
- {id: fa.ves.lihc.forefeast_6_4, slot: vespers.lihc.stichera, tier: 2,
   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]}, {pred: feast_period_in, args: ["forefeast:transfiguration"]}],
   fill: {res: 6, other: [4], of: [forefeast]}, source: typikon, locator: "Ch V Aug 5 on Sunday p.448", status: explicit}
- {id: fa.ves.lihc.forefeast_theophany, slot: vespers.lihc.stichera, tier: 2,
   when: [{pred: sunday_eve}, {pred: season_is, args: [ordinary]}, {pred: feast_period_in, args: ["forefeast:theophany"]},
