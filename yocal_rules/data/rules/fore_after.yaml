# ================= Vespers prokeimenon: the Saturday is itself a great feast of the Lord =================
- {id: fa.ves.prokeimenon.great, slot: vespers.prokeimenon, tier: 3,
   when: [{pred: sunday_eve}, {pred: date_in, args: ["12-26", "01-07", "08-07", "09-15"]}],
   fill: {kind: great, tone: 7}, source: typikon,
   locator: "Ch III p.13 ('If a feast of the Lord falls on a Saturday, on Saturday evening we chant the special prokeimenon of the feast'); Dec 26 p.152, Jan 7 p.179, Transfiguration p.449 ('At the evening of the feast, on any day ... the Great Prokeimenon'); tone 7 for the great prokeimena",
   status: explicit,
   conflict: {with: [ves.prokeimenon.sat], status: open,
              note: "Typikon p.13 first bullet: Saturday evening is always 'The Lord is King' except Nativity and Epiphany; its third bullet (and p.449) gives the feast's great prokeimenon when a feast of the Lord falls on Saturday. ANCA follows the third bullet 3/3 (VESP 2022-08-06 Transfiguration, 2024-01-06 Theophany, 2024-09-14 Elevation). Presentation (Feb 2) on a Saturday is unsampled and not listed."}}

# ================= Apolytikia: Resurrection + troparion of the (fore/after)feast (+ great saint) =================
