# Work package P: Pascha (pascha_days 0). See yocal_rules/PASCHA_PLAN.md.
# Typikon = Antiochian Typikon (Khoury/Morris 2011): Holy Saturday Vesperal Liturgy Ch VI pp.516-517; Ch VII Pascha pp.518-523 (Matins 518-520,
# Liturgy 520-522, Agape Vespers 522-523); St George transferred to Bright Monday Ch V Apr 23 p.325. Printed page = the 'Back to Table of Contents N' footer closing the page.
# The engine has Vespers / Matins / Liturgy slots only: the Midnight Office, the Rush procession, the Paschal Hours/Office and Compline are NOT modelled.
# Four services share this file (slots.yaml):
#   vespers (Saturday, the eve = Holy Saturday Vesperal Liturgy, Vespers part only; its Liturgy part is not modelled),
#   matins (Paschal Orthros; the Vigil outline's Midnight Office and Resurrection Service are not slots), liturgy, agape (Sunday evening, own service).
# Verification (ANCA, one sample each unless stated): Holy Saturday 2026 'Holy-Sat-Vesperal-Lit-NEW'; Orthros 2026 '8-Paschal VIGIL' (outline of rubrics);
# Liturgy 2026 '9-Paschal-READ'; Agape 2020 (readers' text), 2024 (with St George), 2026. No ANCA text exists for Pascha 2018, 2019, 2021-2023, 2025 (index lists no
# Vigil/READ/Agape file; 2025 has only the readers' 'Paschal TYPIKA'), so every Rule is Typikon-explicit or single-sample inferred.

# ======================= Holy Saturday Vesperal Liturgy of St Basil (service vespers; the eve of Pascha) =======================
