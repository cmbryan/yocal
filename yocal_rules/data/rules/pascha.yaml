   conflict: {with: ["Typikon Ch VI p.516 ('Glory…' 'Now and ever… The great Moses…')"], status: misreading,
              note: "Count part is a misreading (#42 item 4): ANCA 2026 prints verses 10 and 9 without hymns and 4 Holy Saturday slots (3 distinct idiomela, the 1st repeated), so 4R+4 = 8 hymns, matching the Typikon's 4R+4 count. Residual wording difference (not a count conflict): the Typikon prints 'Glory… Now and ever… The great Moses' (one doxastikon for both?) while ANCA 2026 sings the Moses doxastikon at Glory and a Tone-1 Resurrection theotokion at Now. The slot compares counts only; the parts text follows ANCA. Single ANCA sample."}}
