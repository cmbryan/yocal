   source: typikon, locator: "Jan 1 on Sunday p.166 (2nd antiphon refrain 'O Son of God, circumcised in the flesh, save us')", status: explicit}
- {id: mf.jan1.sun.lit.eisodikon, slot: liturgy.eisodikon, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {kind: sunday, parts: ["Entrance hymn of Sundays (“Come, let us worship … Save us, O Son of God, Who art risen from the dead”)"]},
   source: typikon, locator: "Jan 1 on Sunday p.166 (entrance hymn 'Come let us worship … who wast risen')", status: explicit}
