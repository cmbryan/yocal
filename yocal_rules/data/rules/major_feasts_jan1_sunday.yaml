# Work package I (cont.): Circumcision of the Lord / St Basil (Jan 1) falling on a Sunday (predicate sunday_feast_order, ordinary season).
# Sat Dec 31 Great Vespers = the eve (Nativity leavetaking day; the Typikon's Jan 1 Sunday order p.165 prints no leavetaking material and ANCA 2022-12-31 has none); Matins; Liturgy of St Basil.
# Enabled in slices.yaml as "01-01:sunday". Verified against the ONLY available ANCA texts: 2022-12-31 (Great Vespers), 2023-01-01 (Orthros, Liturgy Variables).
# ANCA coverage starts 2018-02 (anca_pages.json); Jan 1 Sundays 2017 (before coverage; probed, 404), 2028, 2034, 2045 have no ANCA text, so every rule here is single-sample.
# Typikon order: Ch V Jan 1 'If the feast falls on Sunday' pp.165-166 (printed pages). A Sunday Jan 1 is NOT 'the Sunday after the Nativity' (p.160: that Sunday moves to Dec 26).
# The Typikon Sunday-after-Nativity/Dec 31 leavetaking orders (pp.157-158, 161-162; 3R+4+3) do not apply (they need Dec 31 on a Sunday); this is a different order (4R+3+3).
# Class scope: the #39 'Theotokos-feast Sunday evlogetaria not sung' conflict does NOT apply: Jan 1 is a feast of the Lord + a great saint; Ch I s5 VI p.25 omits evlogetaria only for a Theotokos
# feast, and Jan 1 p.165 lists 'The evlogetaria'. ANCA 2023 sings them: no conflict.
# Slots not written here fall to the generic Sunday / feast Rules (Saturday prokeimenon, katavasia p.164-165, communion p.166, author, alleluia, dismissal).

# ================= Great Vespers (Saturday evening, Dec 31) =================
- {id: mf.jan1.sun.ves.lihc, slot: vespers.lihc.stichera, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {res: 4, other: [3, 3], parts: ["4 stichera of the Resurrection — Octoechos Tone {tone}", "3 stichera of the Circumcision (2 stichera, the first repeated) — Menaion 01-01", "3 stichera of St Basil — Menaion 01-01", "Glory: doxastikon of St Basil; Now: theotokion of the Resurrection — Octoechos Tone {tone}"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 (10 stichera: 4 Resurrection, 2 feast with the first repeated = 3, 3 St Basil; Glory St Basil, Now Resurrection); Ch V Jan 1", status: explicit}
- {id: mf.jan1.sun.ves.readings, slot: vespers.readings, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {count: 3, parts: ["3 Old Testament readings of the Circumcision — Menaion 01-01"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 (the readings for the Circumcision); count from the Menaion", status: inferred,
   evidence: "count: ANCA Great Vespers 2022-12-31 prints 3 readings (Genesis 17:1-14, Proverbs 8:22-30, Wisdom of Solomon)"}
- {id: mf.jan1.sun.ves.litia, slot: vespers.litia, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {litia: true, parts: ["Litia and Artoklasia after the litany of supplication (if the parish serves it) — Menaion 01-01"]},
   source: anca, locator: "inferred: ANCA places the Litia at Great Vespers ('If your parish will offer the Service of the Litia and Artoklasia, it is performed here')",
   status: inferred, evidence: "ANCA Great Vespers 2022-12-31 (single sample)",
   conflict: {with: [mf.ves.litia, "Typikon Jan 1 on Sunday p.165 (Litia at the Midnight Service)"], status: accepted,
              note: "Accepted, class-scoped (same class as #39's evlogetaria): explained, non-blocking. Same class as the weekday conflict mf.ves.litia: the Typikon puts the Litia in the Midnight Service; ANCA prints it at Great Vespers as a parish option. Project default: follow ANCA. Single ANCA sample."}}
- {id: mf.jan1.sun.ves.aposticha, slot: vespers.aposticha, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {owner: resurrection, parts: ["Aposticha: stichera of the Resurrection — Octoechos Tone {tone}", "Glory: of St Basil; Now: of the Circumcision (“The supremely good God was not ashamed …”) — Menaion 01-01"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 (Resurrection stichera; Glory St Basil; Now Circumcision)", status: explicit}
- {id: mf.jan1.sun.ves.apolytikia, slot: vespers.apolytikia, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {res_tone: "$tone", saint: true, parts: ["Apolytikion of the Resurrection — Octoechos Tone {tone}", "Apolytikion of St Basil the Great — Menaion 01-01", "Apolytikion of the Circumcision — Menaion 01-01"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 (troparia: Resurrection, St Basil, Circumcision)", status: explicit}

# ================= Matins =================
