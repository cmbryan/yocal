   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {res_tone: "$tone", saint: true, parts: ["Apolytikion of the Resurrection — Octoechos Tone {tone}", "Apolytikion of St Basil the Great — Menaion 01-01", "Apolytikion of the Circumcision — Menaion 01-01"]},
   source: typikon, locator: "God is the Lord: Jan 1 on Sunday p.165 (as at Vespers)", status: explicit}
- {id: mf.jan1.sun.mat.kathismata, slot: matins.kathismata, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {tone: "$tone", parts: ["1st and 2nd kathisma: Resurrection — Octoechos Tone {tone}; Glory: of St Basil; Now: of the Circumcision — Menaion 01-01", "3rd kathisma of St Basil — Menaion 01-01"]},
   source: anca, locator: "inferred: Ch I s5 V p.25 (great saint on Sunday: 1st and 2nd kathisma Resurrection, 3rd for the saint); Jan 1 on Sunday p.165", status: inferred,
   evidence: "ANCA Orthros 2023-01-01 'Resurrectional & Festal Kathismata': Resurrection hymn, Glory St Basil, Now Circumcision (1st and 2nd); 3rd kathisma for the feast (St Basil)",
   conflict: {with: ["Typikon Jan 1 on Sunday p.165 ('the poetic kathisma from the Menaion'; the kathisma of St Basil after the 3rd ode)"], status: open,
              note: "The Typikon's Jan 1 entry names one Menaion kathisma and places St Basil's after the 3rd ode; ANCA (and Ch I s5 V p.25 for a great saint) sings the Resurrection kathismata with the saint's Glory and the feast's Now, then the saint's 3rd kathisma. Project default: follow ANCA. Single ANCA sample."}}
- {id: mf.jan1.sun.mat.evlogetaria, slot: matins.evlogetaria, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {kind: resurrectional, parts: ["Resurrectional evlogetaria (“The company of the Angels”) after the kathismata, then the Little Litany"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 ('The evlogetaria'); Ch I s5 VI p.25 (omitted only for a feast of the Theotokos on Sunday)", status: explicit}
- {id: mf.jan1.sun.mat.prokeimenon, slot: matins.prokeimenon, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {kind: resurrectional, tone: "$tone", parts: ["Hypakoe, anabathmoi and prokeimenon of the Resurrection — Octoechos Tone {tone}"]},
   source: typikon, locator: "Jan 1 on Sunday p.165 (hypakoe, anabathmoi and prokeimenon for the Resurrection in the tone of the week)", status: explicit}
- {id: mf.jan1.sun.mat.kontakion, slot: matins.kontakion, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {kind: feast, parts: ["After the 3rd ode: kontakion and oikos of the Resurrection — Octoechos Tone {tone}; kathisma of St Basil", "After the 6th ode: kontakion and oikos of St Basil, then the monologion — Menaion 01-01"]},
   source: typikon, locator: "Jan 1 on Sunday p.165", status: explicit}
- {id: mf.jan1.sun.mat.praises, slot: matins.praises, tier: -10,
   when: [{pred: sunday_feast_order, args: [circumcision]}],
   fill: {total: 8, res: 4, other: [4], parts: ["8 stichera: 4 of the Resurrection — Octoechos Tone {tone}; 4 of the Circumcision — Menaion 01-01", "Glory: of St Basil; Now: of the Circumcision"]},
   source: typikon, locator: "Jan 1 on Sunday p.166 (8 stichera: 4 Resurrection, 4 Circumcision; Glory St Basil, Now Circumcision)", status: explicit}

