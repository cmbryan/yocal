# Work package I (cont.): Nativity (Dec 25) and Theophany (Jan 6) falling on a MONDAY. Predicate feast_on_monday_order.
# Typikon (printed pages): Nativity Monday p.145-148 ('If the feast falls on Monday': Royal Hours Fri Dec 22, Forefathers Sat evening/Sun, then
# 'On Sunday evening we celebrate Great Vespers for the Nativity of Christ following the order given when the feast falls on Sunday' = p.143-144,
# 'On Monday morning ... the Divine Liturgy of Saint Basil' p.148). Theophany Monday p.174-176 (Royal Hours Fri Jan 3, Sunday Jan 5 = Sunday before Epiphany
# p.168-169/175-176, 'At Great Vespers on Sunday Evening' and 'Monday morning' p.176).
# The Sunday itself (Dec 24 / Jan 5, Sunday before Nativity / Theophany) and its Saturday Great Vespers are covered by the existing named-Sunday Rules
# (sunday_general.yaml, sunday_a_named.yaml, praises.yaml, kontakion.yaml); not repeated here.
# Rules shared with the Tuesday-Saturday order are NOT here: major_feasts.yaml widens them with feast_not_sunday (their locators name the Monday pages).
# Rules here are the ones whose Monday order differs from Tue-Sat (eve = Sunday-evening Great Vespers, no Vesperal Liturgy; Liturgy of St Basil).
# No ANCA text exists for either Monday: slices.yaml keeps both Mondays disabled (documents show 'Incomplete'); see tests/yocal_rules/test_major_monday.py.
# Royal Hours, Great Compline and the Midnight Service are not slots of this engine (Vespers, Matins, Liturgy only): not encoded.

# ================= Nativity: eve = Sunday-evening Great Vespers (Dec 24) =================
- {id: mf.nat.mon.ves.prokeimenon, slot: vespers.prokeimenon, tier: -10, when: [{pred: feast_on_monday_order}, {pred: major_feast_is, args: [nativity]}],
   fill: {}, source: typikon, locator: "p.143-144 (Sunday order: 'O Gladsome Light' then the readings; no prokeimenon listed); p.140 (Tue-Sat: 'the prokeimenon of the day')",
   status: missing, ticket: "Typikon p.144 omits the prokeimenon where p.140 has the daily one; omission vs shorthand unclear, no ANCA Nativity text; not guessed"}
- {id: mf.nat.mon.ves.readings, slot: vespers.readings, tier: -10, when: [{pred: feast_on_monday_order}, {pred: major_feast_is, args: [nativity]}],
   fill: {count: 2, parts: ["Readings: Genesis 1:1-13 with the troparion “Thou wast born secretly in the cave” and its verses; Isaiah 9:6-7 (the 7th reading of the Menaion) with “Thou hast shone forth from a Virgin” and its verses", "Then the Epistle and the Gospel at once, without “Let us pray to the Lord” (no Vesperal Liturgy follows)"]},
   source: typikon, locator: "p.144 (via p.148: Sunday evening follows the order given for a Sunday feast, p.143-144)", status: explicit,
   conflict: {with: [mf.nat.ves.readings], status: open,
              note: "Same as the weekday Rule: Typikon 2 readings (here Genesis and Isaiah 9:6-7, named the 1st and 7th reading), Menaion 8 (Typikon editor's note p.140). No ANCA Nativity text; Typikon kept. The Epistle and Gospel references are not printed at p.144."}}
- {id: mf.nat.mon.ves.litia, slot: vespers.litia, tier: -10, when: [{pred: feast_on_monday_order}, {pred: major_feast_is, args: [nativity]}],
   fill: {litia: false, parts: ["No Litia at this Vespers (the Litia is sung at the Midnight Service of the feast)"]},
   source: typikon, locator: "p.144 (Midnight Service: 'The litia'; the Vespers order lists the Ektenia of Fervent Supplication, then the aposticha)", status: explicit,
   conflict: {with: [mf.nat.ves.litia, mf.ves.litia], status: accepted, note: "Accepted, class-scoped (same class as #39's evlogetaria): explained, non-blocking. As the Tuesday-Saturday Rule: ANCA moves the Litia to Great Vespers on the other feasts; no ANCA Nativity text. Typikon kept."}}
- {id: mf.nat.mon.ves.aposticha, slot: vespers.aposticha, tier: -10, when: [{pred: feast_on_monday_order}, {pred: major_feast_is, args: [nativity]}],
   fill: {owner: feast, parts: ["Aposticha of the Nativity (“Today hath come a great and wonderful thing”), then “Lord, now lettest Thou Thy servant”"]},
   source: typikon, locator: "p.144 (unlike the Tue-Sat eve, p.140, which has no aposticha: Vespers passes into the Vesperal Liturgy)", status: explicit}
- {id: mf.nat.mon.ves.apolytikia, slot: vespers.apolytikia, tier: -10, when: [{pred: feast_on_monday_order}, {pred: major_feast_is, args: [nativity]}],
   fill: {res_tone: null, saint: true, parts: ["After “Holy God”: the troparion of the Nativity (“Thy Nativity, O Christ our God”), thrice", "Dismissal with “May He Who was born in a cave and lay in a manger for our salvation”"]},
   source: typikon, locator: "p.144", status: explicit}

