# Which Sundays the Rules cover. A date outside every list is 'Incomplete' (date-dependent Rules are withheld, slots missing).
# Work packages enable a category here once their Rules (and tests) exist; one item per line so edits do not collide.
# Keys are PATTERN claims: a key verified on one ANCA year enables every year with that pattern. A list item is a plain string or
# {key: ..., verified_years: [...]} (optional): the ANCA years the key was verified on (calfacts slice_verified_years / verified; the banner shows them).
supported_seasons:
  - ordinary
  - pentecostarion                                   # G: pentecostarion.yaml (Thomas .. Pentecost)
  - triodion                                         # F: triodion.yaml (Publican .. Cheesefare)
  - lent                                             # F: triodion.yaml (Lent 1-5, Palm Sunday)
supported_fore_after:       # substrings of the DB fore_after text, e.g. "Forefeast of The Nativity"
  - Forefeast of the Theophany                       # H: fore_after.yaml (ordinary season only, see calfacts.in_slice)
  - Afterfeast of The Theophany                      # H
  - Forefeast of the Presentation of the Lord        # H
  - Afterfeast of the Presentation of the Lord       # H
  - Afterfeast of the Entrance of the Lord to the Temple  # H (DB name for the Presentation afterfeast, Feb 3)
  - Transfiguration                                  # H: fore/after/leavetaking
  - Dormition of the Mother of God                   # H: fore/after/leavetaking
  - Nativity of the Mother of God                    # H: fore/after/leavetaking
  - Elevation of the Cross                           # H: fore/after
  - Leavetaking of the Elevation of the Precious     # H
  - Entrance of the Mother of God into the Temple    # H: fore/after/leavetaking
  - The Nativity of Christ                           # H: fore/after/leavetaking
  - Leavetaking of The Nativity of the Forerunner    # H
  - Leavetaking of The Beheading of the Forerunner   # H
  - Forefeast of the Procession of the Precious      # H: generic Sunday Rules (Typikon p.442: forefeast suppressed on Sunday)
  - Forefeast of the Conception of the Mother of God # H: generic Sunday Rules (not a Major feast; ANCA 2024-12-08)
  - Afterfeast of the Ascension                      # G: Sunday of the Holy Fathers (pentecostarion.yaml)
  - Forefeast of The Annunciation                   # F: Mar 24 on a Lent Sunday (triodion.yaml; Lent 2 partly missing)
  - Afterfeast of The Annunciation                   # F: Mar 26 on Lent 4 (triodion.yaml; other Lent Sundays missing)
supported_fixed_major:      # mm-dd of fixed Major feasts whose weekday/Saturday order has Rules; 'mm-dd:sunday' = the Sunday order
  - {key: "08-06", verified_years: [2026]}                  # I: major_feasts.yaml (Transfiguration)
  - {key: "09-14", verified_years: [2026]}                  # I: Elevation
  - {key: "02-02", verified_years: [2026]}                  # I: Presentation
  - {key: "09-08", verified_years: [2026]}                  # I: Nativity of the Theotokos
  - {key: "11-21", verified_years: [2025]}                  # I: Entrance of the Theotokos
  - {key: "08-15", verified_years: [2026]}                  # I: Dormition
  - {key: "01-01", verified_years: [2026]}                  # I: Circumcision / St Basil
  - {key: "09-08:sunday", verified_years: [2019, 2024]}           # I: major_feasts_sunday.yaml (Nativity of the Theotokos on Sunday; ANCA 2019, 2024)
  - {key: "02-02:sunday", verified_years: [2020, 2025]}           # I: Presentation on an ordinary-season Sunday (ANCA 2020, 2025); a Triodion Sunday stays disabled (Typikon p.220 alt. order)
  - {key: "11-21:sunday", verified_years: [2021]}           # I: Entrance of the Theotokos on Sunday (ANCA 2021)
  - {key: "08-15:sunday", verified_years: [2021]}           # I: Dormition on Sunday (ANCA 2021)
  - {key: "03-25:Monday", verified_years: [2019]}           # I: Annunciation feast-day Matins/Liturgy on a Monday (ANCA 2019); 'mm-dd:Weekday' = that weekday only, never the eve Vespers
  - {key: "03-25:Wednesday", verified_years: [2026]}        # I: Annunciation feast-day Matins/Liturgy on a Wednesday (ANCA 2026)
  - {key: "01-01:sunday", verified_years: [2023]}           # I: Circumcision / St Basil on Sunday (major_feasts_jan1_sunday.yaml; ANCA 2022-12-31 Vespers, 2023-01-01 Matins/Liturgy only: single sample)
  - {key: "03-25:sunday@-14", verified_years: [2018]}       # I: Annunciation on the 5th Sunday of Great Lent (ANCA 2018); 'mm-dd:sunday@N' = that Sunday only (N days from Pascha), eve Vespers included
  # "08-06:sunday" / "09-14:sunday" (Transfiguration, Elevation) stay disabled: no ANCA text exists for a Sunday: the liturgicday pages for 2023-08-05/06 and 2025-09-13/14 list no service texts (re-checked), so the cached files are 0 bytes (= 404); the undated 'Aug 06'/'Sept 14' files are 2026 weekday texts. Re-check ANCA before enabling
  # "12-25" / "01-06" (Nativity, Theophany; Tue-Sat Rules in major_feasts.yaml) stay disabled: no ANCA Nativity text, no ANCA Theophany Liturgy text (unverified)
  # "12-25:Monday" / "01-06:Monday": Typikon-only Rules exist (major_feasts_nat_thy_monday.yaml, p.145-148 / p.174-176) but no ANCA text to verify them: stay disabled
supported_movable_major:    # ids of movable Major feasts not on a Sunday (calfacts.MAJOR_MOVABLE)
  - {key: "ascension", verified_years: [2026]}                # I: major_feasts.yaml
supported_major_eve_vespers:  # 'mm-dd:Weekday' = eve Great Vespers only (weekday of the eve) of a fixed Major feast; Matins/Liturgy of that feast stay disabled
  - {key: "03-25:Sunday", verified_years: [2019]}            # I: Annunciation eve before a Monday feast (ANCA 2019); Mon/Wed/Thu/Fri eves have no ANCA Great Vespers text (2025/2021/2022/2023)
  - {key: "03-25:Tuesday", verified_years: [2020, 2026]}           # I: Annunciation eve before a Wednesday feast (ANCA 2026; 2020 Readers Vespers)
supported_pascha:           # services enabled on Pascha day (calfacts.season 'pascha'); 'vespers' = Holy Saturday Vesperal Liturgy (eve of Pascha), 'agape' = Agape Vespers (Sunday evening)
  - {key: "vespers", verified_years: [2026]}                  # P: pascha.yaml (ANCA 2026-04-11 Holy Saturday Vesperal Liturgy text; single sample, Typikon p.516-517)
  - {key: "matins", verified_years: [2026]}                   # P: pascha.yaml (ANCA 2026 Paschal Vigil outline; single sample, Typikon p.518-520)
  - {key: "liturgy", verified_years: [2026]}                  # P: pascha.yaml (ANCA 2026-04-12 READ; single sample, Typikon p.520-522)
  - {key: "agape", verified_years: [2020, 2024, 2026]}                    # P: pascha.yaml (ANCA 2020 readers' text, 2024 with St George, 2026; Typikon p.522-523, p.325)
