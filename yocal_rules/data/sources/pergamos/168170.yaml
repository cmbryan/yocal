summary: >
  Anthology in Lesbian (Georgios Lesbios) notation, mainly slow/medium settings for Vespers/Orthros (vol.1) and the Divine Liturgy + Great Lent (vol.2).
  Vol.1: Vespers (Anoixantaria, Makarios aner, Kekragaria, Phos hilaron, Theotoke Parthene), Orthros (Triadika, Evlogitaria, Polyeleoi, Pasapnoaria, Doxologies short by Manuel Protopsaltes and great), Trisagion of the Cross, Makarios aner appendix.
  Vol.2: Liturgy of Chrysostom (fixed parts p.7-26; Cherubika stases p.27-145; Axion estin p.145; Koinonika p.150-319), Great Lent (p.320-370: Liturgy of Presanctified p.346, Liturgy of Basil p.359, Akathist p.364).
  LITANY RESPONSES: YES, partly. Seen on page: Κύριε ἐλέησον (Chourmouzios Chartophylax, 8 tones, each a threefold Κύριε ἐλέησον, p.24-27; img 194-195) and Δόξα σοι Κύριε / Εἰς πολλὰ ἔτη (p.23, Pinax only). NOT in the Pinax: Παράσχου Κύριε, Σοὶ Κύριε, Ἀμήν, Καὶ τῷ πνεύματί σου, Ἔλεος εἰρήνης, Εἷς Ἅγιος, Σὲ ὑμνοῦμεν (not individually listed; p.1-6 of vol.2 and the Liturgy text itself not sampled; likely absent).
  FIXED PARTS found (Pinax, vol.2): Χριστὸς ἀνέστη 7, Antiphons of Despotic/Theomitoric feasts 8 (seen header), Εἰσοδικά 9, Ὅσοι εἰς Χριστόν 11 (seen header), Τὸν Σταυρόν σου 12, Τρισάγιον 14-18, Κύριε σῶσον 19, Ἀλληλούαριον 21, Δόξα σοι Κύριε 23, Κύριε ἐλέησον 24, Cherubika, Ἄξιον ἐστί 145, Koinonika 150-319 (Αἰνεῖτε in 8 tones x 3 stases; feast koinonika), Εἴδομεν τὸ φῶς + Εἴη τὸ ὄνομα Κυρίου 318, Τὸν Δεσπότην καὶ Ἀρχιερέα 319. Εὐλογητὸς ὁ ἐρχόμενος absent from Pinax (maybe within Εἰσοδικά p.9).
  Resurrectional apolytikia/kontakia/prokeimena: none listed. Tones are by number in headings 'Τρόπος α΄..η΄' (hymns.py: pl1=5, pl2=6, grave=7, pl4=8).
  Many entries are in Pinax order; page numbers are printed, per volume. Status 'page' = header/content seen.
