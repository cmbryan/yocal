summary: >
  Divine Liturgy volume. Mostly Petros Lambadarios (Peloponnesios) plus Gregorios, Chourmouzios, Daniel, Petros Byzantios, Ioannis Protopsaltes etc.
  Pp.3-110 contain the short/parish-usable fixed parts (Christos anesti, typika, festal antiphons, Eisodikon, Trisagion + Dynamis variants, Alleluia, Kyrie eleison, Cherubika of the week).
  Pp.159-435 are further Cherubika (many tones, long/kalophonic); 437 Liturgy of Basil (Sanctus etc.); Axion estin 442 (TOC misprints 342); Koinonika 456-620 (weekly Aineite by tone, Daniel/Petros/Gregorios); pp.622-848 festal cherubika+koinonika by feast (papadic, one line each); 859-884 kalophonic heirmoi (papadic); 885 explanation of the kratema "tereré" + tables.
  Litany responses: Kyrie eleison (Chourmouzios, p.58, tones; verified on page, several tones incl. grave); Paraschou Kyrie / Soi Kyrie / Amen / Kai to pneumati sou NOT listed in the TOC (not checked in pp.7-26, 34-54 where they may sit inside "Typika"/"Ἕτερα"). Doxa soi Kyrie at pp.52-54.
