toc_images: []
summary: >
  No contents list: indexed from running heads of all 233 images (month + day numeral on the right page; Triodion section titles). Menaion feast order and dates match PG052/PG136 Πίναξ (Jan 1,5,6,7,17,18,20,25,27,30; Feb 2; Mar 25; Apr 23; May 21; Jun 24,29; Jul 2,20,25,26,27; Aug 1,6,15,29).
  Doxastika only (short settings); slot labels (Εἰς τὸν Στίχον / Εἰς τοὺς Αἴνους Δόξα) appear inline but were not read per feast except samples (Sept 5 p.7 'Δόξα'; Jan 25 p.163 Αἴνοι Δόξα pl.4). No litany responses, no Liturgy fixed parts, no resurrectional apolytikia/prokeimena.
  Last images: Παραγράμματα (errata) and Κατάλογος of subscribers; 'Ἐδῶ ὑποσημειοῦται τὸ Δοξαστικόν, τὸ Ζητούμενον' note at p.436.
