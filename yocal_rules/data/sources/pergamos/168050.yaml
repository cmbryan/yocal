# Pergamos uoadl:168050 — Σύντομον Δοξαστάριον τοῦ ἀοιδίμου Πέτρου Λαμπαδαρίου τοῦ Πελοποννησίου (1820): shortened doxastika, Menaion pp.1-239 then Triodion/Pentecostarion pp.243-436.
# Index from running heads (no Πίναξ); scans in FETCHED/ (not in git; CC BY-NC-ND). Dedication: Alexandros Nikolaou Soutzou, Prince of Wallachia.
# Hymn-id convention used here (no doxastika ids exist yet in hymns.py; letters-only suffix fits hymns.py regexes men/MM-DD/[a-z]+\d*):
#   men/MM-DD/doxastikon = all doxastika of the feast (slot not yet read); mov/N/doxastikon likewise (N = days from Pascha).
#   Where a spread was read: doxastikonvespers (Lord-I-call Δόξα [καὶ νῦν], unlabelled first Δόξα of the feast), doxastikonlity (Εἰς τὴν Λιτήν),
#   doxastikonaposticha (Εἰς τὸν Στίχον), doxastikonpraises (Εἰς τοὺς Αἴνους); `slots:` lists id@printed-page; "-kainyn" = the Καὶ νῦν after that Δόξα.
#   No slot label inside a feast = only Δόξα(+Καὶ νῦν); `slots` present only when the page was actually read.
