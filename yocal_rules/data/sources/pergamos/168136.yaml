# Pergamos uoadl:168136 — Δοξαστικὰ τοῦ ἐνιαυτοῦ τῶν δεσποτικῶν καὶ θεομητορικῶν ἑορτῶν καὶ τῶν ἑορταζομένων ἁγίων (Πέτρου Πελοποννησίου, ἐξηγηθέντα κατὰ τὴν νέαν μέθοδον παρὰ Γρηγορίου Πρωτοψάλτου), Τόμος Α΄, 1835.
# Contents (Πίναξ) transcribed from PDF images 184–185 (p.363 and 366-367; the p.364-365 spread is NOT in this scan: entries Oct 26–Jan 20 taken from PG052 Πίναξ, same pagination); scans in FETCHED/ (not in git; CC BY-NC-ND). Same Πίναξ/pagination as PG052 (1821 edition, old notation); this is the 1835 re-notation by Gregory Protopsaltes.
# NB: Πίναξ page numbers are typeset one row off in places (two-line entries); Dec entries checked against row count (Nicholas 114, Anna 125, Spyridon 128).
# Hymn-id convention used here (no doxastika ids exist yet in hymns.py; letters-only suffix fits hymns.py regexes men/MM-DD/[a-z]+\d*):
#   men/MM-DD/doxastikon = all doxastika of the feast (slot not yet read); mov/N/doxastikon likewise (N = days from Pascha).
#   Where a spread was read: doxastikonvespers (Lord-I-call Δόξα [καὶ νῦν], unlabelled first Δόξα of the feast), doxastikonlity (Εἰς τὴν Λιτήν),
#   doxastikonaposticha (Εἰς τὸν Στίχον), doxastikonpraises (Εἰς τοὺς Αἴνους); `slots:` lists id@printed-page; "-kainyn" = the Καὶ νῦν after that Δόξα.
#   No slot label inside a feast = only Δόξα(+Καὶ νῦν); `slots` present only when the page was actually read.
