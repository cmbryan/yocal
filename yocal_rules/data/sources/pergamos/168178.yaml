summary: "Part A: short Anastasimatarion (resurrectional Vespers/Orthros pieces per tone, short style; Orthros Alleluia p.8). Part B: for the major fixed feasts only (not every saint), idiomela + 'Ἀπολυτίκιον' rubric (seen p.55 Nativity, p.165) with the date in the right-page running header. hymn: men/MM-DD/apolytikion is therefore the likely match for Part B but each section also has other items; verify per page. Part A tone sections give oct/t{t}/sun/* material but sub-slots (Kyrie ekekraxa stichera, aposticha, apolytikion, theotokion) not itemised; no ids assigned. Part A tone page ranges +-2. No litany responses (no separate Κύριε ἐλέησον etc. seen), no Liturgy fixed parts, no prokeimena; resurrectional apolytikia/kontakia not located explicitly (probably inside each tone's Vespers/Orthros section)."
