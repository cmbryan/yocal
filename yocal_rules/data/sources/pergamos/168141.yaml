# Pergamos uoadl:168141 — Δοξαστικὰ Τριῳδίου καὶ Πεντηκοσταρίου, μελισθέντα παρὰ Πέτρου Λαμπαδαρίου τοῦ Πελοποννησίου, ἐξηγηθέντα κατὰ τὴν νέαν μέθοδον παρὰ Γρηγορίου Πρωτοψάλτου, Τόμος Β΄ (1835).
# Contents (Πίναξ) transcribed from PDF images 198-199 (first Πίναξ page has no printed number; second page prints 290 [=390?] and 389). Scans in FETCHED/ (not in git; CC BY-NC-ND).
# Hymn-id convention used here (no doxastika ids exist yet in hymns.py; letters-only suffix fits hymns.py regexes men/MM-DD/[a-z]+\d*):
#   men/MM-DD/doxastikon = all doxastika of the feast (slot not yet read); mov/N/doxastikon likewise (N = days from Pascha).
#   Where a spread was read: doxastikonvespers (Lord-I-call Δόξα [καὶ νῦν], unlabelled first Δόξα of the feast), doxastikonlity (Εἰς τὴν Λιτήν),
#   doxastikonaposticha (Εἰς τὸν Στίχον), doxastikonpraises (Εἰς τοὺς Αἴνους); `slots:` lists id@printed-page; "-kainyn" = the Καὶ νῦν after that Δόξα.
#   No slot label inside a feast = only Δόξα(+Καὶ νῦν); `slots` present only when the page was actually read.
#   moveable ids here: mov/N/doxastikon, N = days from Pascha (Publican -70, Prodigal -63, Meatfare Sunday -56, Cheesefare -49, Lent Sundays -42,-35,-28,-21,-14, Palm -7, Pascha 0, Thomas 7, ..., Pentecost 49, All Saints 56).
#   Contents list gives weekdays/Sundays only; slots inside a service (Vespers Δόξα, Aposticha, Praises) are not stated in the Πίναξ.
id: "168141"
key: PG141
title: Δοξαστικὰ Τριῳδίου καὶ Πεντηκοσταρίου (Τόμος Β΄)
year: 1835
file: "168141 Δοξαστικά Τριωδίου και Πεντηκοσταρίου, μελισθέντα παρά Πέτρου λαμπαδαρίου του Πελοποννησίο (1835).pdf"
layout: [{from: 1, div: 2, add: 4}]   # PDF image = (printed // div) + add, for printed >= from (and <= to); last match wins
# calibration checks: image = printed // 2 + 4; checked p.4 = img 6 .. p.388 = img 198 every 16 pages (pp.2-3 = img 5)
toc_images: [198, 199]
summary: >
  Doxastika (idiomela/doxastika, Δόξα καὶ νῦν settings) for the Triodion and Pentecostarion Sundays and weekday services, Holy Week (Ἰδιόμελα, Hours, Ἀκολουθία τῶν Παθῶν), Pascha to All Saints; then a Παράρτημα of irmologic antiphons (p.289, Gregory Protopsaltes), irmologic Αἶνοι (p.335, Theodore Phokaeus) and 13 kalophonic heirmoi (p.339, Ogourlou).
  No litany responses, no Liturgy fixed parts, no resurrectional apolytikia/prokeimena listed in the Πίναξ.
