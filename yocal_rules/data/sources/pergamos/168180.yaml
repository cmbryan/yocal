summary: >
  Vespers (Ἑσπερινός) anthology by various composers. Parish-usable items are a minority: syntomon Ἀνοιξαντάρια (38), the
  Κεκραγάρια (113-203, by tone: Ioannes Damaskinos / Balasios / Iakovos), Φῶς ἱλαρόν (212, ancient melos, checked), prokeimena of the week/Lent Sundays/feasts (214-218, checked),
  Θεοτόκε Παρθένε settings (221, 233, 253), Κύριε ἐλέησον τῆς Ἀρτοκλασίας (253), the three Doxastika of the Hours (254), Lenten idiomela, Κύριε ἡ ἐν πολλαῖς (299-322, Holy Wednesday).
  Pp.325-412 are Holy Week / Triodion / Presanctified / Akathist material. Many items are kalophonic (Makarios aner 65-112, Kratemata 344-350).
  Vespers fixed parts use lit/vespers/* ids (adopted 2026-11-17).
  Litany responses (Κύριε ἐλέησον, Παράσχου Κύριε, Σοὶ Κύριε, Ἀμήν): none listed except Κύριε ἐλέησον τῆς Ἀρτοκλασίας, p.253 (Artoklasia litany, checked on page).
