summary: "Full stichera idiomela (not only doxastika) for each feast: Sep-Aug Menaion, Triodion Sundays/Lent vespers idiomela, Pentecostarion Sundays. hymn: ids point at the feast's doxastikon, which lies inside the section (a section also has the Lity/Aposticha/Praises idiomela; verify). Page numbers are printed pages (the TOC column is headed Φύλλ.). TOC jumps from p.216 to p.223: pp.217-222 are Triodion idiomela without a TOC line. First-column digits of some TOC rows are misaligned/blotted (noted). No litany responses, no Liturgy fixed parts, no resurrectional apolytikia/prokeimena. Typographic note: contents show 'Τόμος Τρίτος' while 168178 is 'Τόμος Δεύτερος'."
