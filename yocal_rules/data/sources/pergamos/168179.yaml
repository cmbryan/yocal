summary: >
  Slow Anastasimatarion only: Sunday Vespers (stichera, apostixa, apolytikia), Orthros (kathismata, antiphona, canons, katavasiai, Aines, katanyktika/martyrika) for the 8 tones, plus the 11 Eothina (p.322-334, end ΤΕΛΟΣ).
  NO Liturgy section despite the title-page mention in the catalogue: the Pinax has none and the book ends at p.334 with the Eothina. NO litany responses (Κύριε ἐλέησον, Παράσχου, Σοὶ Κύριε, Ἀμήν) and no Liturgy fixed parts: sampled p.1, 10-15, 30-31, 114-119 are all melismatic papadic text, no responses. Slow (argon) settings: low parish value; the short settings are in AN/PD2 (byzantine_pd.yaml).
  Order of tones in book: 1, 2, 3, 4, pl1, pl2, grave, pl4 (tone numbers below: pl1=5, pl2=6, grave=7, pl4=8). Tone 2 and plagal 1/2 sections give no separate apostixa line.
