summary: "Western staff notation (SATB: Antiphonos/Soprano, Oxyphonos/Alto, Mesophonos/Tenore, Baryphonos/Basso + Pianoforte or Physharmonica), Greek text under the notes; Nº 1-113. Οδηγία (img 4) says: this second part contains the apolytikia of the despotic and theometoric feasts and of commemorated saints, the kontakia of the despotic and theometoric feasts only, the eisodika of the year, the Rite of the Cross, the Great Hagiasmos service; appended funeral apolytikion Μνήσθητι Κύριε, martyr kontakion Ὡς ἀπαρχὴ τῆς φύσεως, apolytikion of St Theodore, and Ὁ Μάρτυς σου. The Οδηγία says the resurrectional apolytikion is sung before the entrance on Sundays but is not included here: NO Octoechos resurrectional apolytikia seen. Menaion order Sept-Aug, then Triodion, then Pentecostarion. No litany responses; no Liturgy fixed parts (those are in 168174). Only the pieces seen at the sampled spreads are listed (about 30 of 113)."
