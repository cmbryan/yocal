  men/12-25/communion:
    - {book: TA2, pages: [150, 262], status: toc, note: "tones 2, grave, pl4"}
  men/01-06/communion:
    - {book: TA2, pages: [150, 162], status: toc, note: "tone 2"}
  men/03-25/communion:
    - {book: TA2, pages: [163, 221], status: toc, note: "tones 3, 4"}
  men/08-06/communion:
    - {book: TA2, pages: [127, 262], status: toc, note: "tones 1, 2, 3, pl1, pl4"}
  men/09-14/communion:
    - {book: TA2, pages: [150, 262], status: toc, note: "tones 2, 3, grave, pl4"}
  men/09-01/communion:
