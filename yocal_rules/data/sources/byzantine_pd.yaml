  lit/trisagion/baptized:
    - {book: TA1, pages: [293, 293], status: toc, note: "Dynamis ending only"}
  lit/trisagion/cross:
    - {book: TA1, pages: [287, 293], status: verify}
  lit/sun/t{t}/alleluia:
    - {book: TA1, pages: [294, 295], status: toc, note: "generic Gospel alleluia melody"}
