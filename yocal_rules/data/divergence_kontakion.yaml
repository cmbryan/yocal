# Matins kontakion divergences (#27). ANCA 2026 'both' (resurrectional + feast) is now a Rule (mat.kontakion.anca_both.*, from 2026-06-07)
# where the Typikon has a feast or fore/after-feast kontakion. Remaining: saints the Typikon does not rank; no Rule.
- slot: matins.kontakion
  source: anca
  scope:
    date: ["2026-07-05", "2026-07-12", "2026-10-18"]
  theirs: {kind: both}
  class: anca_2026_resurrectional_plus_feast
  reason: "Sundays after Pentecost on saints the Typikon p.28 does not list (Athanasius of Athos 07-05, Paisios 07-12, Apostle Luke 10-18). ANCA 2026 reads in #27 print the saint's kontakion beside the resurrectional; the cached ANCA pages have no kontakion key, so unverified. Rules print the resurrectional only."
- slot: matins.kontakion
  source: anca
  scope: {date: ["2022-11-20"]}
  ours: {kind: resurrectional}
  theirs: {kind: feast}
  class: anca_forefeast_prints_feast
  reason: "Nov 20 (forefeast of the Entrance) on a Sunday: Typikon Ch V p.108-117 gives the resurrectional kontakion at ode 6; ANCA 2022 prints the Entrance kontakion and oikos. One sample (2022); no Rule."
- slot: matins.kontakion
  source: dcs
  ours: {kind: both}
  theirs: {kind: resurrectional}
  class: dcs_resurrectional_only_vs_anca_both
  reason: "Rules follow ANCA 2026 'both' (mat.kontakion.anca_both.*, parish decision 2026-11-16); DCS prints the resurrectional kontakion/oikos only (e.g. 2026-11-22 Entrance afterfeast). DCS is a text source here, not the decider."
