# Divergence log: accepted differences between our output and an Answer key (class-scoped; one-off scope = date + service).
# Each entry: slot, source (anca|dcs), scope (context facts), ours, theirs (value or list of alternatives), class, reason.
# A diff matching no entry is unexplained (blocking for ANCA). UK divergences are never logged.
- slot: vespers.lihc.stichera
  source: anca
  scope: {two_sets_of_3: true}
  ours: {res: 4, other: [6]}
  theirs:
    - {res: 6, other: [4]}
    - {res: 7, other: [3]}
  class: anca_year_variant
  reason: "#32: ANCA compilers pick 4R+6 on most two-sets Sundays but 6R+4/7R+3 in some years (~12% variance); inferred Rule, non-blocking"

# Dec 7 (Ambrose): ANCA gives a Glory; ALWB and Bp Basil show none, no Typikon named-Sunday section applies, and Violakis has no entry.
# Not otherwise investigated; ANCA alone cannot justify a glory override (#28). (Oct 11, Jun 7 and Jul 19 were earlier logged here
# in error: they are Typikon named Sundays and are now Rules.)
- slot: vespers.lihc.stichera
  source: anca
  scope: {mmdd: ["12-07"]}
  ours: {res: 7, other: [3]}
  theirs: {res: 6, other: [4]}
  class: anca_adds_glory
  reason: "ANCA prints a saint's Doxasticon (6R+4) where ALWB/Bp Basil have none (#34 'ALWB data gap' class); no independent evidence found"
- slot: [vespers.apolytikia, matins.apolytikia, liturgy.apolytikia]
  source: anca
  scope: {mmdd: ["12-07"]}
  ours: {saint: false}
  theirs: {saint: true}
  class: anca_adds_glory
  reason: "follows the ANCA Doxasticon above: saint's apolytikion sung"

# Generic Fathers / All Saints Sundays: ANCA names no saint although the default (ANCA-following) rule does. Same Sundays are named in other years; no separating feature found.
- slot: liturgy.dismissal
  source: anca
  scope: {mmdd: ["07-14", "07-13", "07-19", "10-11", "10-12", "06-15", "06-07"]}
  ours: {saint_named: true}
  theirs: {saint_named: false}
  class: anca_generic_sunday_not_named
  reason: "ANCA names the saint on most Sundays but not on some Fathers/All Saints Sundays (7 of 116, 2022-26); no rule found"

# 2024-02-11: ANCA's dismissal opens "May He Who and rose from the dead" (the feast phrase is dropped, a template slip);
# no other cached ANCA Liturgy file has it, and no feast of the Lord is kept that day (Presentation leavetaking was Feb 9).
- slot: liturgy.dismissal_phrase
  source: anca
  scope: {date: ["2024-02-11"]}
  ours: {phrase: resurrection}
  theirs: {phrase: feast_and_resurrection}
  class: anca_typo
  reason: "ANCA READ 2024-02-11 prints 'May He Who and rose from the dead' (feast phrase missing, parsed as feast_and_resurrection); one-off typo, the plain 'May He Who rose' is right for an ordinary Sunday (Typikon p.17)"

